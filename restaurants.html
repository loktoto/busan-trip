let q='',filter='全部';
const $=id=>document.getElementById(id);
function naver(q){return 'https://map.naver.com/p/search/'+encodeURIComponent(q)}
function kakao(q){return 'https://map.kakao.com/link/search/'+encodeURIComponent(q)}
function renderChips(){const cats=['全部',...Array.from(new Set(data.map(x=>x.cat)))];$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===filter?'on':''}" data-cat="${c}">${c}</button>`).join('')}
function rows(){return data.filter(x=>(filter==='全部'||x.cat===filter)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q.toLowerCase())))}
function render(){renderChips();const a=rows();$('count').textContent=`${a.length} 間餐廳 · 按 Naver/Kakao 用韓文名搜尋`; $('list').innerHTML=a.map(x=>card(x)).join('')}
function card(x){const flags=[x.blue?'藍絲帶 '+x.blue:'',x.hot?'IG/Threads熱門':'',x.chef?'黑白大廚':''].filter(Boolean).join(' · ');return `<article class="card"><div class="row"><span class="tag">${x.cat}</span><span class="tag">₩${x.price}</span></div><h2 class="title">${x.zh}</h2><div class="ko">${x.ko}</div><p class="meta"><b>${x.area}</b> · ${x.food}</p>${flags?`<div class="flags">${flags}</div>`:''}${x.note?`<p class="note">${x.note}</p>`:''}<div class="actions"><a class="btn" href="${naver(x.ko)}">Naver</a><a class="btn" href="${kakao(x.ko)}">Kakao</a><a class="btn" href="${naver(x.ko+' '+x.area)}">區域搜尋</a></div></article>`}
$('search').oninput=e=>{q=e.target.value;render()};$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;filter=b.dataset.cat;render()};render();
