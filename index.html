<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Busan Planner</title><style>
:root{--bg:#f6f4ee;--card:#fffefa;--ink:#101815;--muted:#66736d;--line:#e7e0d4;--brand:#0f766e;--soft:#e5f5f1;--warn:#fff1c7;--bad:#ffe1dc;--shadow:0 8px 22px rgba(20,30,25,.08)}html[data-theme=dark]{--bg:#0e1412;--card:#151d1a;--ink:#edf4f0;--muted:#a2b0aa;--line:#283630;--brand:#2dd4bf;--soft:#173b37;--warn:#453912;--bad:#421a16;--shadow:0 10px 26px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","Noto Sans TC","Noto Sans KR",Arial,sans-serif;line-height:1.45}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;padding:10px 10px calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:-10px -10px 8px;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}.bar{display:flex;justify-content:space-between;gap:8px}.bar h1{font-size:25px;line-height:1;letter-spacing:-.055em;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.mini,.ghost{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;padding:7px 10px;font-size:12px}.tabs,.subtabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 8px;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar,.subtabs::-webkit-scrollbar{display:none}.tab,.subtab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px}.tab.on,.subtab.on{background:var(--brand);border-color:var(--brand);color:#fff}.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:16px}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 8px}.status h2{font-size:19px;line-height:1.1;letter-spacing:-.04em;margin:0}.status p{font-size:12px;color:var(--muted);margin:3px 0 0}.mapCard{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}.mapCard.show{display:block}.mapHead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.mapHead b{font-size:15px}.mapHead span{font-size:12px;color:var(--muted)}.mapScroll{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}.metroStage{position:relative;width:1300px;max-width:none}.metroStage img{display:block;width:1300px;height:auto}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;background:var(--brand);color:#fff;border-radius:999px;min-width:34px;height:34px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;box-shadow:0 3px 12px rgba(0,0,0,.28);z-index:2}.pin small{font-size:10px;margin-left:3px}.pin.on{background:#d97706}.pinLabel{position:absolute;transform:translate(-50%,20px);background:rgba(255,255,255,.92);color:#111;border:1px solid #ddd;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:800;white-space:nowrap;z-index:1}.unmatched{padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.body{padding:12px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.time{background:var(--soft);color:var(--brand);font-weight:850;border-radius:999px;padding:5px 9px;font-size:12px}.tag{font-size:11px;font-weight:760;background:rgba(120,120,120,.13);color:var(--muted);border-radius:999px;padding:4px 7px;white-space:nowrap}.tag.vbp{background:var(--warn);color:#a36a00}.tag.bad{background:var(--bad);color:#d35245}.title{font-size:18px;line-height:1.18;letter-spacing:-.035em;margin:8px 0 2px}.ko{font-size:13px;color:var(--brand);font-weight:760}.note,.meta{font-size:13px;color:var(--muted);margin:8px 0 0}.meta b{color:var(--ink)}.box{margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:12px;background:rgba(15,118,110,.08);font-size:13px;word-break:break-word}.box a{color:var(--brand);font-weight:800}.flags{font-size:12px;color:var(--ink);margin-top:8px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.actions.two{grid-template-columns:1fr 1fr}.actions.four{grid-template-columns:repeat(4,1fr)}.btn{border:0;background:var(--brand);color:#fff;border-radius:13px;min-height:39px;padding:8px;font-size:12px;font-weight:800;text-align:center}.btn.light{background:var(--card);color:var(--brand);border:1px solid var(--line)}.btn.red{background:#b42318}.editbox{display:none;margin-top:10px;padding:10px;border-radius:14px;background:rgba(128,128,128,.07);border:1px dashed var(--line)}.editing .editbox{display:grid;gap:8px}.editing .movebar{display:grid}.field{display:grid;gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:9px;font-size:16px}.field textarea{min-height:68px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.movebar{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:#fff;font-weight:900}.done .check{background:var(--brand);border-color:var(--brand)}.done{opacity:.68}.bottom{position:fixed;left:10px;right:10px;bottom:max(9px,env(safe-area-inset-bottom));z-index:50;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:21px;padding:7px;box-shadow:0 12px 34px rgba(20,30,25,.18)}.bottom button{min-height:46px;border-radius:15px;border:0;font-weight:850}.edit,.add{background:var(--card);color:var(--brand);border:1px </style></head><body><main class="app"><header class="top"><div class="bar"><div><h1>釜山 5日4夜</h1><div class="sub" id="saveLine">DB connected</div></div><div><button class="mini" id="themeBtn">🌙</button><button class="mini" id="dbBtn">DB ✓</button></div></div><nav class="tabs" id="tabs"></nav><nav class="subtabs" id="restaurantTabs" style="display:none"></nav><input class="search" id="search" placeholder="搜尋景點 / 韓文 / 餐廳 / Material"></header><section class="status"><div><h2 id="heading">Day 1</h2><p id="count">Loading...</p></div><button class="ghost" id="copyBtn">Copy Sheet</button></section><section class="mapCard" id="metroMapCard"><div class="mapHead"><div><b>餐廳地鐵分佈圖</b><br><span>撳 pin 篩選該站附近餐廳</span></div><button class="ghost" id="clearStationBtn">全部</button></div><div class="mapScroll"><div class="metroStage" id="metroStage"><img src="https://pic.pimg.tw/may0103/1442916706-2949340533_n.jpg" alt="Busan metro map"></div></div><div class="unmatched" id="unmatchedLine"></div></section><section id="content"></section></main><nav class="bottom"><button class="edit" id="editBtn">✏️ Edit</button><button class="add" id="addBtn">＋ Add</button><button class="save" id="saveBtn">💾 Save</button></nav><div class="toast" id="toast">Saved</div><iframe name="hiddenFrame" style="display:none"></iframe><script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';const BACKEND='https://script.google.com/macros/s/AKfycbw7lefshgNgHHA91E6Z_STgQjAJb1w3ERWBdDE8lbtck85EiSL_STbbbaj-NRy0drd2/exec';const KEY='busan2026';const H=['Day','Date','Start','End','TitleZH','TitleKO','LocationZH','LocationKO','Notes','VBP','Category','MapQueryKO','ImageUrl','PhotoCredit','Remark','AddressKO','TravelTime','RainPlan','LastSavedAt','RestaurantID','Cuisine','Signature','Area','NearestStation','PriceKRW','Michelin2026','BlueRibbon','IGThreadsHot','BlackSpoon','Priority','DataStatus','SourceURL','ReservationURL','OpeningHours','ClosedDays','Lat','Lng','MapVerified','NaverPlaceUrl','KakaoPlaceUrl'];const STORE='busan-extended-v1',THEME='busan-theme-v1',LAST='busan-last-save-v1';const STATION_COORDS={'해운대':{x:82.4,y:45.7,label:'海雲台'},'중동':{x:83.6,y:43.6,label:'中洞'},'동백':{x:81.1,y:47.8,label:'冬柏'},'장산':{x:85.1,y:41.5,label:'萇山'},'광안':{x:70.8,y:56.8,label:'廣安'},'수영':{x:66.6,y:46.6,label:'水營'},'남천':{x:70.2,y:60.0,label:'南川'},'금련산':{x:70.3,y:58.3,label:'金蓮山'},'민락':{x:72.6,y:47.8,label:'民樂'},'서면':{x:52.0,y:61.2,label:'西面'},'전포':{x:55.9,y:64.0,label:'田浦'},'부전':{x:54.9,y:56.7,label:'釜田'},'개금':{x:43.9,y:70.8,label:'開琴'},'남포':{x:52.3,y:82.4,label:'南浦'},'자갈치':{x:50.4,y:83.5,label:'札嘎其'},'부산역':{x:52.8,y:76.0,label:'釜山站'},'영도':{x:53.0,y:86.0,label:'影島'},'덕천':{x:29.7,y:59.1,label:'德川'},'화명':{x:28.2,y:32.9,label:'華明'},'구서':{x:51.4,y:22.8,label:'久瑞'},'두실':{x:51.8,y:19.7,label:'斗實'},'기장':{x:87.0,y:37.5,label:'機張'},'송정':{x:86.2,y:42.8,label:'松亭'}};let rows=[],tab='Day 1',q='',editing=false,restaurantFilter='全部',stationFilter='';const $=id=>document.getElementById(id);initTheme();init();async function init(){try{const r=await fetch(CSV,{cache:'no-store'});rows=csvObj(await r.text()).filter(x=>x.Day&&x.TitleZH).map(norm).map(hydrate)}catch(e){rows=load(STORE,null)||[]}if(!rows.length)rows=defaults();ensure();rows=rows.map(hydrate);saveLocal(false);render()}function defaults(){return[{Day:'Day 1',Date:'6/19 週五',Start:'06:00',TitleZH:'抵達金海國際機場',TitleKO:'김해국제공항',LocationZH:'金海國際機場',LocationKO:'김해국제공항',MapQueryKO:'김해국제공항'}].map(norm)}function norm(o){const x={id:o.id||crypto.randomUUID()};H.forEach(h=>x[h]=o[h]||'');x.MapQueryKO=x.MapQueryKO||x.TitleKO||x.LocationKO||x.TitleZH||'';return x}function hydrate(x){if(/^assets\/img\/(gamcheon|gwangalli)\.svg$/i.test(x.ImageUrl||''))x.ImageUrl='';const t=(x.Day+' '+x.TitleZH+' '+x.TitleKO+' '+x.MapQueryKO+' '+x.LocationKO+' '+x.Area+' '+x.Cuisine).toLowerCase();if(!x.Category&&x.VBP&&!isVbp(x.VBP))x.Category=x.VBP;if(x.Day==='餐廳'){x.MapQueryKO=x.MapQueryKO||[x.TitleKO,x.Area||x.LocationZH].filter(Boolean).join(' ');x.LocationZH=x.LocationZH||x.Area;x.LocationKO=x.LocationKO||x.NearestStation;x.VBP=x.VBP||x.PriceKRW;x.RainPlan='';x.TravelTime='';return x}if(!x.TravelTime){if(t.includes('공항')||t.includes('機場'))x.TravelTime=x.Day==='Day 5'?'約45–60分鐘去機場':'約60–75分鐘去海雲台';else if(t.includes('감천'))x.TravelTime='約20–30分鐘去南浦 / 影島';else if(t.includes('광안'))x.TravelTime='約25–35分鐘返海雲台';else if(t.includes('스카이캡슐'))x.TravelTime='約10–15分鐘步行去青沙浦';else if(t.includes('용궁사'))x.TravelTime='約25–35分鐘去機張市場'}if(!x.RainPlan)x.RainPlan=rainPlanFor(x);if(isIndoorRow(x))x.RainPlan='';if(x.Day==='Material'&&!x.Remark)x.Remark=materialUrl(x.TitleZH+x.TitleKO);return x}function isVbp(v){return /使用|免費|啟動|不包|另購|不確定|open|done/.test(v||'')}function materialUrl(s){if(/Blue|블루|天空|스카이캡슐/.test(s))return'https://www.bluelinepark.com/eng/';if(/Pass|패스|VBP/.test(s))return'https://www.visitbusanpass.com/';if(/ARTE|아르떼/.test(s))return'https://artemuseum.com/BUSAN';if(/廣安|광안|드론/.test(s))return'https://www.busan.go.kr/zht/bsevents';if(/Luge|루지/.test(s))return'https://busan.skylineluge.kr/en/';return''}function isIndoorRow(x){const s=(x.Day+' '+x.TitleZH+' '+x.TitleKO+' '+x.LocationZH+' '+x.LocationKO+' '+x.MapQueryKO).toLowerCase();return x.Day==='餐廳'||x.Day==='Todo'||x.Day==='注意'||x.
