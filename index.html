<!doctype html><html lang='zh-HK'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Busan Planner</title><style>:root{--bg:#f6f4ee;--card:#fffefa;--ink:#111;--muted:#66736d;--line:#e4ded3;--brand:#0f766e;--soft:#e8f6f3;--warn:#fff1c7}html[data-theme=dark]{--bg:#0b1110;--card:#121b18;--ink:#f2f6f3;--muted:#9aa9a3;--line:#273630;--brand:#2dd4bf;--soft:#153b36;--warn:#423711}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif}.app{max-width:760px;margin:auto;padding:12px 12px 106px}button,input{font:inherit}.top{position:sticky;top:0;z-index:9;margin:-12px -12px 12px;padding:12px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.bar,.status,.row{display:flex;justify-content:space-between;gap:10px}.bar h1{font-size:30px;line-height:1;margin:0;letter-spacing:-.06em}.sub,.muted,.note,.meta{color:var(--muted);font-size:13px}.mini,.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;min-height:44px;padding:9px 14px;font-weight:800}.mini{min-width:46px;padding:0}.scroller{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:9px 0}.scroller::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;white-space:nowrap;word-break:keep-all;line-height:1;display:inline-flex;align-items:center;justify-content:center;min-width:max-content}.pill.small{font-size:13px;min-height:40px;padding:8px 12px}.on{background:var(--brand)!important;color:white!important;border-color:var(--brand)!important}.search{width:100%;min-height:50px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:12px 14px;font-size:16px}.status{align-items:flex-start;margin:10px 2px}.status h2{font-size:24px;margin:0;letter-spacing:-.04em}.map{display:none;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px}.map.show{display:block}.mapHead{padding:12px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}.mapBody{display:none;overflow:auto;background:white;max-height:46vh}.map.open .mapBody{display:block}.map img{width:1300px;display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:0 0 12px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.08)}.body{padding:15px}.tag,.time{font-size:12px;font-weight:850;border-radius:999px;padding:5px 9px;background:rgba(120,120,120,.14);color:var(--muted);white-space:nowrap}.time{background:var(--soft);color:var(--brand)}.vbp{background:var(--warn);color:#9a6500}.title{font-size:20px;line-height:1.15;letter-spacing:-.04em;margin:10px 0 3px}.ko{color:var(--brand);font-weight:850}.note,.meta{margin:9px 0 0;line-height:1.45}.next{background:rgba(45,212,191,.1);border:1px solid var(--line);border-radius:14px;padding:9px 10px;color:var(--ink)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pri{background:var(--brand);color:white}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.actions.four{grid-template-columns:repeat(4,1fr)}.btn{border-radius:15px;text-align:center}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 14px 36px rgba(0,0,0,.22)}.bottom button{min-height:50px;border:0;border-radius:17px;font-weight:900}.save{background:var(--brand);color:white}.save.dirty{background:#d97706}.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:10px 14px;display:none}.toast.show{display:block}@media(max-width:480px){.actions.four{grid-template-columns:repeat(2,1fr)}.bar h1{font-size:30px}}</style></head><body><main class='app'><header class='top'><div class='bar'><div><h1>釜山 5日4夜</h1><div class='sub' id='saveLine'>DB connected</div></div><div><button class='mini' id='theme'>🌙</button><button class='mini'>DB ✓</button></div></div><nav class='scroller' id='tabs'></nav><nav class='scroller' id='cat'></nav><nav class='scroller' id='food'></nav><input class='search' id='search' placeholder='搜尋景點 / 韓文 / 餐廳 / 食物類型 / Material'></header><section class='status'><div><h2 id='head'>Day 1</h2><p id='count' class='muted'>Loading</p></div><button class='pill' id='copy'>Copy Sheet</button></section><section class='map' id='map'><div class='mapHead'><div><b>餐廳地鐵分佈圖</b><br><span class='muted'>最近地鐵站參考</span></div><button class='pill on' id='mapBtn'>打開地圖</button></div><div class='mapBody'><img src='https://pic.pimg.tw/may0103/1442916706-2949340533_n.jpg'></div></section><section id='list'></section></main><nav class='bottom'><button class='pill' id='edit'>✏️ Edit</button><button class='pill' id='add'>＋ Add</button><button class='save' id='save'>💾 Save</button></nav><div class='toast' id='toast'></div><iframe name='hiddenFrame' style='display:none'></iframe><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv',BACKEND='https://script.google.com/macros/s/AKfycbw7lefshgNgHHA91E6Z_STgQjAJb1w3ERWBdDE8lbtck85EiSL_STbbbaj-NRy0drd2/exec',KEY='busan2026',STORE='busan-extended-v1',THEME='busan-theme-v1',LAST='busan-last-save-v1',H='Day,Date,Start,End,TitleZH,TitleKO,LocationZH,LocationKO,Notes,VBP,Category,MapQueryKO,ImageUrl,PhotoCredit,Remark,AddressKO,TravelTime,RainPlan,LastSavedAt,RestaurantID,Cuisine,Signature,Area,NearestStation,PriceKRW,Michelin2026,BlueRibbon,IGThreadsHot,BlackSpoon,Priority,DataStatus,SourceURL,ReservationURL,OpeningHours,ClosedDays,Lat,Lng,MapVerified,NaverPlaceUrl,KakaoPlaceUrl'.split(',');let rows=[],tab='Day 1',q='',cf='全部',ff='全部類型',dirty=false,edit=false;const $=id=>document.getElementById(id),DQ=String.fromCharCode(34),TB=String.fromCharCode(9),NL=String.fromCharCode(10);init();async function init(){document.documentElement.dataset.theme=localStorage.getItem(THEME)||'dark';try{let r=await fetch(CSV,{cache:'no-store'});rows=csv(await r.text()).filter(x=>x.Day&&x.TitleZH).map(norm)}catch(e){rows=JSON.parse(localStorage.getItem(STORE)||'[]')}render()}function norm(o){let x={id:o.id||crypto.randomUUID()};H.forEach(h=>x[h]=o[h]||'');x.MapQueryKO=x.MapQueryKO||x.TitleKO||x.LocationKO||x.TitleZH;return x}function csv(s){let a=parse(s),h=a[0]||[];return a.slice(1).map(r=>{let o={};h.forEach((k,i)=>o[k.trim()]=r[i]||'');return o})}function parse(s){let out=[],row=[],f='',qq=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c===DQ){if(qq&&n===DQ){f+=DQ;i++}else qq=!qq}else if(c===','&&!qq){row.push(f);f=''}else if((c.charCodeAt(0)===10||c.charCodeAt(0)===13)&&!qq){if(c.charCodeAt(0)===13&&n&&n.charCodeAt(0)===10)i++;row.push(f);if(row.some(x=>x.trim()))out.push(row);row=[];f=''}else f+=c}row.push(f);if(row.some(x=>x.trim()))out.push(row);return out}function tabs(){let d=[...['Day 1','Day 2','Day 3','Day 4','Day 5'].filter(x=>rows.some(r=>r.Day===x)),'餐廳','Todo','注意','Material'];$('tabs').innerHTML=d.map(x=>pill(x,tab===x,'data-tab')).join('');let c=$('cat'),f=$('food');if(tab!=='餐廳'){c.innerHTML=f.innerHTML='';$('map').classList.remove('show');return}$('map').classList.add('show');c.innerHTML=[['全部','全部'],['S/A','S/A'],['米芝蓮','米芝蓮'],['Bib','Bib'],['藍絲帶','藍絲帶'],['IG','IG'],['平價','平價'],['海雲台','海雲台'],['廣安里','廣安里'],['西面/田浦','西面/田浦']].map(a=>pill(a[0],cf===a[1],'data-cat',a[1],'small')).join('');f.innerHTML=[['全部類型','全部類型'],['韓食','韓食'],['豬湯飯','豬肉湯飯'],['冷麵/麵','麵食'],['燒肉','燒肉'],['海鮮/鰻','海鮮'],['日式','日式'],['西餐','西餐'],['法/創意','法式'],['中港台泰','亞洲']].map(a=>pill(a[0],ff===a[1],'data-food',a[1],'small')).join('')}function pill(t,on,a,v,s=''){return `<button class='pill ${s} ${on?'on':''}' ${a}='${esc(v||t)}'>${esc(t)}</button>`}function pass(x){if(tab!=='餐廳')return true;let b=Object.values(x).join(' '),area=(x.Area||x.LocationZH||'')+' '+(x.NearestStation||x.LocationKO||''),catok=cf==='全部'||(cf==='S/A'&&/S|A/i.test(x.Priority||''))||(cf==='米芝蓮'&&['米芝蓮','Michelin','一星','精選','Bib'].some(s=>(x.Category+' '+x.Michelin2026).includes(s)))||(cf==='Bib'&&(x.Category+' '+x.Michelin2026).includes('Bib'))||(cf==='藍絲帶'&&(x.BlueRibbon||b.includes('藍絲帶')))||(cf==='IG'&&(x.IGThreadsHot||b.includes('IG')||b.includes('Threads')))||(cf==='平價'&&['9,000','10,000','12,000','15,000','20,000'].some(s=>(x.PriceKRW||x.VBP||'').includes(s)))||(cf==='海雲台'&&['海雲台','해운대','中洞','冬柏'].some(s=>area.includes(s)))||(cf==='廣安里'&&['廣安','광안','水營','南川','金蓮山'].some(s=>area.includes(s)))||(cf==='西面/田浦'&&['西面','田浦','서면','전포'].some(s=>area.includes(s)));let m={韓食:['韓食','家常','定食','한식','국밥','만두'],豬肉湯飯:['豬肉湯飯','돼지국밥','국밥'],麵食:['冷麵','냉면','蕎麥','메밀','麵','면','국수','牛肉麵','拉麵'],燒肉:['烤肉','燒烤','韓牛','불고기','갈비','한우'],海鮮:['海鮮','河豚','鰻','魚','복국','장어'],日式:['日本','日式','Omakase','오마카세','라멘','야키토리'],西餐:['意式','義大利','西餐','파스타','버거'],法式:['法式','프렌치','創意','퓨전'],亞洲:['中式','港式','台式','泰式','點心','刈包']};let foodok=ff==='全部類型'||(m[ff]||[]).some(s=>b.includes(s));return catok&&foodok}function route(x,i,a){if(x.TravelTime)return x.TravelTime;if(!/^Day /.test(x.Day)||i>=a.length-1)return '';let n=a[i+1],dest=n.LocationZH||n.TitleZH,blob=[x.TitleZH,x.LocationZH,n.TitleZH,n.LocationZH].join(' ');if(blob.includes('機場'))return '約45–75分鐘去 '+dest;if(blob.includes('甘川'))return '約20–30分鐘去 '+dest;if(blob.includes('南浦')||blob.includes('札嘎其')||blob.includes('BIFF'))return '約5–30分鐘去 '+dest;if(blob.includes('廣安'))return '約25–45分鐘去 '+dest;if(blob.includes('海雲台')||blob.includes('青沙浦')||blob.includes('尾浦'))return '約10–30分鐘去 '+dest;return '約15–30分鐘去 '+dest}function render(){tabs();let a=rows.filter(x=>x.Day===tab).filter(pass).filter(x=>!q||Object.values(x).join(' ').toLowerCase().includes(q));$('head').textContent=tab==='注意'?'注意事項':tab;$('count').textContent=a.length+' items'+(tab==='餐廳'?' · '+cf+(ff!=='全部類型'?' · '+ff:''):'');$('saveLine').textContent='DB connected · '+(dirty?'Unsaved changes':'Saved: '+(localStorage.getItem(LAST)||'not yet'));$('save').classList.toggle('dirty',dirty);$('save').textContent=dirty?'💾 Save*':'💾 Save';$('list').innerHTML=a.map((x,i)=>card(x,i,a)).join('')||'<div class=card><div class=body>搵唔到資料</div></div>'}function card(x,i,a){if(x.Day==='餐廳')return restaurant(x);if(x.Day==='Todo')return todo(x);if(x.Day==='注意')return simple(x);if(x.Day==='Material')return material(x);let t=(x.Start||'')+(x.End?'–'+x.End:''),rt=route(x,i,a);return wrap(x,`<div class=row>${t?`<span class=time>${esc(t)}</span>`:''}<span class='tag ${isVbp(x.VBP)?'vbp':''}'>${esc(x.Category||x.VBP||'行程')}</span></div><h3 class=title>${esc(x.TitleZH)}</h3><div class=ko>${esc(x.TitleKO)}</div>${x.Notes?`<p class=note>${esc(x.Notes)}</p>`:''}${rt?`<p class='meta next'><b>→ 下一站：</b>${esc(rt)}</p>`:''}<div class=actions><button class=btn data-a=naver>Naver</button><button class=btn data-a=kakao>Kakao</button><button class=btn data-a=copyko>韓文</button></div>`)}function restaurant(x){let price=x.PriceKRW||x.VBP,area=[x.Area||x.LocationZH,x.NearestStation||x.LocationKO].filter(Boolean).join(' · '),note=[x.Cuisine,x.Signature,x.Notes].filter(Boolean).join('｜');return wrap(x,`<div class=row><span class=tag>${esc(x.Category||'餐廳')}</span><div class=chips>${x.Priority?`<span class='tag pri'>Priority ${esc(x.Priority)}</span>`:''}${price?`<span class=tag>₩${esc(price)}</span>`:''}</div></div><h3 class=title>${esc(x.TitleZH)}</h3><div class=ko>${esc(x.TitleKO)}</div>${area?`<p class=meta><b>${esc(area)}</b></p>`:''}${note?`<p class=note>${esc(note)}</p>`:''}<div class=chips>${[x.Michelin2026?'Michelin '+x.Michelin2026:'',x.BlueRibbon?'Blue Ribbon':'',x.IGThreadsHot?'IG':'',x.BlackSpoon?'黑白大廚':''].filter(Boolean).map(s=>`<span class=tag>${esc(s)}</span>`).join('')}</div><div class='actions four'><button class=btn data-a=naver>Naver</button><button class=btn data-a=kakao>Kakao</button><button class=btn data-a=copyko>韓文</button><button class=btn data-a=source>Source</button></div>`)}function todo(x){return wrap(x,`<div class=row><div><h3 class=title>${esc(x.TitleZH)}</h3>${x.Notes?`<p class=note>${esc(x.Notes)}</p>`:''}</div><button class=btn data-a=done>${x.VBP==='done'?'✓':''}</button></div>`)}function simple(x){return wrap(x,`<h3 class=title>${esc(x.TitleZH)}</h3>${x.Notes?`<p class=note>${esc(x.Notes)}</p>`:''}`)}function material(x){return wrap(x,`<h3 class=title>${esc(x.TitleZH)}</h3><div class=ko>${esc(x.TitleKO)}</div>${x.Notes?`<p class=note>${esc(x.Notes)}</p>`:''}${x.Remark?`<p class=note>${esc(x.Remark)}</p>`:''}<div class='actions'><button class=btn data-a=open>Open</button><button class=btn data-a=copyko>Copy</button></div>`)}function wrap(x,inner){return `<article class=card data-id='${x.id}'><div class=body>${inner}</div></article>`}function act(a,id){let x=rows.find(r=>r.id===id);if(!x)return;if(a==='done'){x.VBP=x.VBP==='done'?'open':'done';dirty=true;saveLocal();render()}if(a==='naver'||a==='kakao')openMap(a,x);if(a==='copyko')copy([x.TitleKO,x.LocationKO||x.NearestStation].filter(Boolean).join(' / '));if(a==='source')openFirst(x.SourceURL||x.ReservationURL);if(a==='open')openFirst(x.Remark)}function openMap(t,x){let text=x.MapQueryKO||x.TitleKO||x.TitleZH||'부산',qq=encodeURIComponent(text);location.href=t==='naver'?`https://map.naver.com/p/search/${qq}`:`https://map.kakao.com/link/search/${qq}`}function add(){let title=prompt('新增標題');if(!title)return;rows.push(norm({Day:tab,TitleZH:title,Category:'新增'}));dirty=true;saveLocal();render()}function saveLocal(){localStorage.setItem(STORE,JSON.stringify(rows))}function saveAll(){let t=new Date().toLocaleString('zh-HK',{hour12:false});rows.forEach(r=>r.LastSavedAt=t);localStorage.setItem(LAST,t);saveLocal();let data=rows.map(x=>{let r={};H.forEach(h=>r[h]=x[h]||'');return r}),f=document.createElement('form'),i=document.createElement('textarea');f.method='POST';f.target='hiddenFrame';f.action=BACKEND;i.name='payload';i.value=JSON.stringify({apiKey:KEY,rows:data});f.appendChild(i);document.body.appendChild(f);f.submit();f.remove();dirty=false;toast('Saved');render()}function copySheet(){copy([H,...rows.map(x=>H.map(h=>x[h]||''))].map(r=>r.join(TB)).join(NL))}function copy(t){navigator.clipboard.writeText(t||'');toast('Copied')}function openFirst(s){s=String(s||'');let i=s.indexOf('http');if(i>=0)window.open(s.slice(i).split(' ')[0],'_blank');else toast('No link')}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(39),'&#039;')}function isVbp(v){return ['使用','免費','啟動','不包','另購','不確定'].some(s=>(v||'').includes(s))}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;cf='全部';ff='全部類型';render()};$('cat').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){cf=b.dataset.cat;render()}};$('food').onclick=e=>{let b=e.target.closest('[data-food]');if(b){ff=b.dataset.food;render()}};$('list').onclick=e=>{let b=e.target.closest('[data-a]'),c=e.target.closest('.card');if(b&&c)act(b.dataset.a,c.dataset.id)};$('search').oninput=e=>{q=e.target.value.toLowerCase();render()};$('mapBtn').onclick=()=>{$('map').classList.toggle('open');$('mapBtn').textContent=$('map').classList.contains('open')?'收起地圖':'打開地圖'};$('theme').onclick=()=>{let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem(THEME,n)};$('copy').onclick=copySheet;$('add').onclick=add;$('edit').onclick=()=>toast('Edit simplified in this hotfix');$('save').onclick=saveAll;</script></body></html>
