<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>釜山行程｜iPhone Planner</title>
  <style>
    :root{--bg:#f6f4ee;--card:#fffefa;--ink:#111814;--muted:#68736d;--line:#e7e0d4;--brand:#0f766e;--brand2:#115e59;--soft:#e5f5f1;--warn:#fff0c7;--danger:#ffe2dc;--shadow:0 8px 22px rgba(20,30,25,.08)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","Noto Sans TC","Noto Sans KR",Arial,sans-serif;line-height:1.45} button,input,textarea{font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none}
    .app{max-width:720px;margin:0 auto;padding:10px 10px calc(92px + env(safe-area-inset-bottom))}
    .top{position:sticky;top:0;z-index:20;margin:-10px -10px 8px;padding:10px 10px 8px;background:rgba(246,244,238,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,224,212,.8)}
    .titlebar{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.titlebar h1{font-size:25px;letter-spacing:-.055em;line-height:1;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.mini{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--brand2);white-space:nowrap}
    .tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;color:var(--muted)}.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
    .search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font-size:16px;outline:none}
    .status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 8px}.status h2{font-size:19px;line-height:1.1;letter-spacing:-.04em;margin:0}.status p{font-size:12px;color:var(--muted);margin:3px 0 0}.ghost{border:1px solid var(--line);background:#fff;color:var(--brand2);border-radius:999px;padding:8px 10px;font-size:12px}
    .cards{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.card.dragging{opacity:.45}.img{width:100%;height:128px;object-fit:cover;background:#eee;display:block}.body{padding:11px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.time{display:inline-flex;background:var(--soft);color:var(--brand2);font-weight:800;border-radius:999px;padding:5px 9px;font-size:12px;white-space:nowrap}.card h3{font-size:17px;line-height:1.18;letter-spacing:-.035em;margin:7px 0 2px}.ko{font-size:13px;color:var(--brand2);font-weight:750;word-break:keep-all}.note{font-size:13px;color:var(--muted);margin:8px 0 0}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{font-size:11px;font-weight:750;background:#f1f0ea;color:var(--muted);border-radius:999px;padding:4px 7px}.tag.vbp{background:var(--warn);color:#7a5200}.tag.bad{background:var(--danger);color:#842218}.credit{font-size:10px;color:#8a928d;margin-top:5px}
    .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.btn{border:0;background:var(--brand);color:#fff;border-radius:13px;min-height:39px;padding:8px;font-size:12px;font-weight:780}.btn.light{background:#fff;color:var(--brand2);border:1px solid var(--line)}.btn.red{background:#b42318}
    .editbox{display:none;margin-top:10px;padding:10px;border-radius:14px;background:#f8f6ef;border:1px dashed var(--line)}.editing .editbox{display:grid;gap:8px}.editing .movebar{display:grid}.field{display:grid;gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:800}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;font-size:16px;outline:none}.field textarea{min-height:68px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.movebar{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
    .sheetbox{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}.sheetbox.show{display:grid;gap:8px}.sheetbox h3{margin:0;font-size:16px}.sheetbox p{margin:0;color:var(--muted);font-size:12px}.sheetbox input{border:1px solid var(--line);border-radius:11px;padding:10px;font-size:16px;width:100%}
    .bottombar{position:fixed;left:10px;right:10px;bottom:max(9px,env(safe-area-inset-bottom));z-index:50;max-width:700px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;background:rgba(255,254,250,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:21px;padding:7px;box-shadow:0 12px 34px rgba(20,30,25,.18)}.bottombar button{min-height:46px;border-radius:15px;border:0;font-weight:850}.edit{background:#fff;color:var(--brand2);border:1px solid var(--line)!important}.add{background:#fff;color:#26352f;border:1px solid var(--line)!important}.save{background:var(--brand);color:#fff}
    .empty{padding:28px 16px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:#111814;color:#fff;border-radius:999px;padding:9px 13px;opacity:0;transition:.18s;z-index:70;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:760px){.app{padding-top:18px}.img{height:190px}.cards{grid-template-columns:1fr 1fr}.status h2{font-size:23px}.bottombar{left:50%;right:auto;transform:translateX(-50%);width:520px}.sheetbox{grid-template-columns:1fr 1fr}.sheetbox h3,.sheetbox p{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="titlebar"><div><h1>釜山 5日4夜</h1><div class="sub">6/19–6/23 · 海雲台 · iPhone planner</div></div><button class="mini" id="settingsBtn">⚙️ Sync</button></div>
      <nav class="tabs" id="tabs"></nav>
      <input class="search" id="search" placeholder="搜尋景點 / 韓文名 / VBP" />
    </header>

    <section class="sheetbox" id="sheetbox">
      <h3>Google Sheet Sync</h3>
      <p>平時可以唔入 Google Sheet。貼 Apps Script URL 後，網站 Save 會寫返 database。</p>
      <input id="backendUrl" placeholder="Apps Script Web App URL /exec" />
      <input id="apiKey" placeholder="Password，例如 busan2026" />
      <button class="btn" id="saveSettings">儲存 sync settings</button>
      <a class="btn light" href="https://docs.google.com/spreadsheets/d/1YpH9XWV4nwVnQ98vkbhx_fxB4c4m1ektEGzxPnWGFNg/edit?usp=sharing" target="_blank">開 Google Sheet</a>
    </section>

    <section class="status"><div><h2 id="heading">全部行程</h2><p id="count">Loading...</p></div><button class="ghost" id="copyBtn">Copy Sheet</button></section>
    <section class="cards" id="cards"></section>
  </main>

  <nav class="bottombar"><button class="edit" id="editBtn">✏️ Edit</button><button class="add" id="addBtn">＋ Add</button><button class="save" id="saveBtn">💾 Save</button></nav>
  <div class="toast" id="toast">Saved</div>
  <iframe name="hiddenFrame" style="display:none"></iframe><form id="saveForm" target="hiddenFrame" method="POST" style="display:none"><textarea name="payload" id="payload"></textarea></form>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv";
const HEADERS=["Day","Date","Start","End","TitleZH","TitleKO","LocationZH","LocationKO","Notes","VBP","Category","MapQueryKO","ImageUrl","PhotoCredit"];
const STORE="busan-mobile-first-items-v1", SETTINGS="busan-mobile-first-settings-v1";
const FALLBACK=[
 ["Day 1","6/19 週五","06:00","","抵達金海國際機場","김해국제공항","金海國際機場","김해국제공항","入境、取行李、T-money / 少量現金。","","交通","김해국제공항"],
 ["Day 1","6/19 週五","09:00","10:30","海雲台早餐 / 傳統市場","해운대전통시장","海雲台傳統市場","해운대전통시장","簡單食早餐，買基本用品。","","餐飲","해운대전통시장"],
 ["Day 2","6/20 週六","09:15","11:15","甘川洞文化村","감천문화마을","甘川洞文化村","감천문화마을","小王子、彩色屋、觀景位。早上去少人啲。","","景點","부산 감천문화마을"],
 ["Day 2","6/20 週六","20:00","20:15","廣安里 M 無人機燈光秀","광안리 M 드론라이트쇼","廣安里海水浴場","광안리해수욕장","天氣差可能取消。可再睇 22:00 第二場。","","限定","광안리 M 드론라이트쇼"],
 ["Day 3","6/21 週日","10:00","10:45","天空膠囊列車：尾浦 → 青沙浦","스카이캡슐 / 미포정거장 → 청사포정거장","海雲台藍線公園","해운대블루라인파크","要提前訂票。","不包 / 另購","景點","스카이캡슐"],
 ["Day 3","6/21 週日","18:45","20:30","Busan X the Sky","부산엑스더스카이","Busan X the Sky","부산엑스더스카이","18:45–19:10 入場，睇日落 + 夜景。","使用","景點","부산엑스더스카이"],
 ["Day 4","6/22 週一","08:40","10:00","海東龍宮寺","해동용궁사","海東龍宮寺","해동용궁사","海邊寺廟，越早越少人。","免費","景點","해동용궁사"],
 ["Day 4","6/22 週一","13:40","16:00","Skyline Luge Busan","스카이라인루지 부산","Skyline Luge Busan","스카이라인루지 부산","唔好排太晏，營業時間可能有變。","使用","景點","스카이라인루지 부산"],
 ["Day 5","6/23 週二","10:15","10:30","出發去金海國際機場","김해국제공항","金海國際機場","김해국제공항","建議的士 / 包車。","","交通","김해국제공항"]
].map(rowToObj);
const PHOTOS=[
 {k:["감천","甘川"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Gamcheon_Cultural_Village%2C_Busan.jpg",c:"Wikimedia Commons"},
 {k:["자갈치","札嘎其"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Jagalchi_Market.jpg",c:"Wikimedia Commons"},
 {k:["BIFF","국제시장","남포","南浦"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/BIFF_Square_Busan.jpg",c:"Wikimedia Commons"},
 {k:["영도","影島"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Yeongdodaegyo_Bridge.jpg",c:"Wikimedia Commons"},
 {k:["광안리","廣安里","드론"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Gwangandaegyo_Bridge_at_night.jpg",c:"Wikimedia Commons"},
 {k:["스카이캡슐","블루라인","청사포","해변열차"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Haeundae_Blueline_Park.jpg",c:"Wikimedia Commons"},
 {k:["해운대","海雲台","부산엑스더스카이","LCT"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Haeundae_Beach_and_Haeundae_LCT_The_Sharp.jpg",c:"Wikimedia Commons"},
 {k:["해동용궁사","龍宮寺"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Haedong_Yonggungsa_Temple.jpg",c:"Wikimedia Commons"},
 {k:["기장","機張"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Gijang_County_Busan.jpg",c:"Wikimedia Commons"},
 {k:["루지","Luge"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Osiria_Tourism_Complex.jpg",c:"Wikimedia Commons"},
 {k:["서면","전포","田浦","西面"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Seomyeon_Busan.jpg",c:"Wikimedia Commons"},
 {k:["김해국제공항","機場"],u:"https://commons.wikimedia.org/wiki/Special:FilePath/Gimhae_International_Airport_International_Terminal.jpg",c:"Wikimedia Commons"}
];
let items=[], day="全部", q="", editing=false, settings=load(SETTINGS,{backendUrl:"",apiKey:"busan2026"});
const $=id=>document.getElementById(id);
init();
async function init(){ $("backendUrl").value=settings.backendUrl||""; $("apiKey").value=settings.apiKey||"busan2026"; const local=load(STORE,null); items=Array.isArray(local)&&local.length?local.map(norm):FALLBACK.map(norm); render(); if(!local){try{const r=await fetch(CSV_URL,{cache:"no-store"}); const csv=await r.text(); const rows=csvObj(csv).filter(x=>x.Day&&x.TitleZH).map(norm); if(rows.length){items=rows; toast("Loaded Sheet")}}catch(e){toast("Using fallback")}; render()}}
function rowToObj(row){let o={};HEADERS.forEach((h,i)=>o[h]=row[i]||"");return o}
function norm(o){let x={id:o.id||crypto.randomUUID(),Day:o.Day||"",Date:o.Date||"",Start:o.Start||"",End:o.End||"",TitleZH:o.TitleZH||"",TitleKO:o.TitleKO||"",LocationZH:o.LocationZH||"",LocationKO:o.LocationKO||"",Notes:o.Notes||"",VBP:o.VBP||"",Category:o.Category||"",MapQueryKO:o.MapQueryKO||o.LocationKO||o.TitleKO||o.TitleZH||"",ImageUrl:o.ImageUrl||"",PhotoCredit:o.PhotoCredit||""}; if(!x.ImageUrl){let p=photo(x);x.ImageUrl=p.u;x.PhotoCredit=x.PhotoCredit||p.c} return x}
function photo(x){let t=Object.values(x).join(" ");return PHOTOS.find(p=>p.k.some(k=>t.includes(k)))||{u:"https://commons.wikimedia.org/wiki/Special:FilePath/Busan_skyline.jpg",c:"Wikimedia Commons"}}
function filtered(){let s=q.trim().toLowerCase();return items.filter(x=>(day==="全部"||x.Day===day)&&(!s||Object.values(x).join(" ").toLowerCase().includes(s)))}
function render(){document.body.classList.toggle("editing",editing);$("editBtn").textContent=editing?"✅ Done":"✏️ Edit"; tabs(); cards();}
function tabs(){let ds=["全部",...Array.from(new Set(items.map(x=>x.Day).filter(Boolean)))];$("tabs").innerHTML=ds.map(d=>`<button class="tab ${d===day?"on":""}" onclick="day='${esc(d)}';render()">${esc(d)}</button>`).join("")}
function cards(){let a=filtered();$("heading").textContent=day==="全部"?"全部行程":`${day} · ${(items.find(x=>x.Day===day)||{}).Date||""}`;$("count").textContent=`${a.length}/${items.length} items ${editing?"· editing":""}`;$("cards").innerHTML=a.length?a.map(card).join(""):`<div class="empty">搵唔到行程</div>`; bind()}
function card(x){let time=`${x.Start||"未定"}${x.End?"–"+x.End:""}`;let bad=x.VBP.includes("不確定");return `<article class="card" data-id="${x.id}"><img class="img" src="${esc(x.ImageUrl)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"><div class="body"><div class="row"><span class="time">${esc(time)}</span><span class="tag ${x.VBP?bad?"bad":"vbp":""}">${esc(x.VBP?"VBP "+x.VBP:x.Category||"行程")}</span></div><h3>${esc(x.TitleZH)}</h3><div class="ko">${esc(x.TitleKO)}</div>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:""}<div class="credit">${esc(x.PhotoCredit||"")}</div><div class="actions"><button class="btn light" onclick="map('naver','${esc((x.MapQueryKO||x.LocationKO||x.TitleKO).replace(/'/g,"\\'"))}')">Naver</button><button class="btn light" onclick="map('kakao','${esc((x.MapQueryKO||x.LocationKO||x.TitleKO).replace(/'/g,"\\'"))}')">Kakao</button><button class="btn light" onclick="copyKo('${x.id}')">韓文</button></div><div class="editbox">${editFields(x)}<div class="movebar"><button class="btn light" onclick="step('${x.id}',-1)">↑ 上移</button><button class="btn light" onclick="step('${x.id}',1)">↓ 下移</button><button class="btn red" onclick="delItem('${x.id}')">Delete</button></div></div></div></article>`}
function editFields(x){let inp=(f,l)=>`<div class="field"><label>${l}</label><input data-id="${x.id}" data-f="${f}" value="${esc(x[f]||"")}"></div>`;return `<div class="grid2">${inp("Day","Day")}${inp("Date","Date")}${inp("Start","Start")}${inp("End","End")}</div>${inp("TitleZH","中文標題")}${inp("TitleKO","韓文標題")}${inp("LocationZH","中文地點")}${inp("LocationKO","韓文地點")}<div class="field"><label>Notes</label><textarea data-id="${x.id}" data-f="Notes">${esc(x.Notes||"")}</textarea></div><div class="grid2">${inp("VBP","VBP")}${inp("Category","分類")}</div>${inp("MapQueryKO","地圖韓文搜尋")}${inp("ImageUrl","Image URL")}${inp("PhotoCredit","Photo Credit")}`}
function bind(){document.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{let x=items.find(i=>i.id===el.dataset.id); if(x){x[el.dataset.f]=el.value; local(false)}})}
function step(id,n){let i=items.findIndex(x=>x.id===id),j=i+n;if(i<0||j<0||j>=items.length)return;if(day!=="全部"&&items[j].Day!==day){toast("已到呢日邊界");return}let [m]=items.splice(i,1);items.splice(j,0,m);local();render()}
function delItem(id){if(confirm("Delete?")){items=items.filter(x=>x.id!==id);local();render()}}
function copyKo(id){let x=items.find(i=>i.id===id);navigator.clipboard.writeText([x.TitleKO,x.LocationKO].filter(Boolean).join(" / "));toast("Copied")}
function map(type,text){let q=encodeURIComponent(text||"부산"); if(type==="naver")openDeep(`nmap://search?query=${q}&appname=busan.trip`,`https://map.naver.com/p/search/${q}`); else openDeep(`kakaomap://search?q=${q}`,`https://map.kakao.com/link/search/${q}`)}
function openDeep(app,web){let t=Date.now();location.href=app;setTimeout(()=>{if(Date.now()-t<1800)location.href=web},850)}
function add(){let d=day==="全部"?"Day 1":day;items.push(norm({Day:d,Date:(items.find(x=>x.Day===d)||{}).Date||"",TitleZH:"新行程",Category:"新增"}));editing=true;local();render();toast("Added")}
function local(show=true){localStorage.setItem(STORE,JSON.stringify(items));if(show)toast("Saved on phone")}
function saveAll(){local(false);let backend=(settings.backendUrl||"").trim();if(!backend){copySheet(false);toast("未連 backend，已儲存在手機");return}let rows=items.map(x=>{let r={};HEADERS.forEach(h=>r[h]=x[h]||"");return r});$("saveForm").action=backend;$("payload").value=JSON.stringify({apiKey:settings.apiKey||"busan2026",rows});$("saveForm").submit();toast("Saving to Sheet")}
function copySheet(show=true){let t=[HEADERS,...items.map(x=>HEADERS.map(h=>x[h]||""))].map(r=>r.map(c=>String(c).replace(/\t|\n/g," ")).join("\t")).join("\n");navigator.clipboard.writeText(t);if(show)toast("Copied Sheet")}
function saveSettings(){settings={backendUrl:$("backendUrl").value.trim(),apiKey:$("apiKey").value.trim()||"busan2026"};localStorage.setItem(SETTINGS,JSON.stringify(settings));toast("Settings saved")}
function csvObj(csv){let rows=parseCsv(csv);let h=rows[0]||[];return rows.slice(1).map(r=>{let o={};h.forEach((k,i)=>o[k.trim()]=r[i]||"");return o})}
function parseCsv(s){let rows=[],row=[],f="",q=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(q&&n==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(x=>x.trim()))rows.push(row);row=[];f=""}else f+=c}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch{return d}} function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))} function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
$("search").oninput=e=>{q=e.target.value;cards()};$("editBtn").onclick=()=>{editing=!editing;render()};$("addBtn").onclick=add;$("saveBtn").onclick=saveAll;$("copyBtn").onclick=()=>copySheet(true);$("settingsBtn").onclick=()=>$("sheetbox").classList.toggle("show");$("saveSettings").onclick=saveSettings;
</script>
</body>
</html>
