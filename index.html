<head>

<body>
<div class="boot" id="boot"><div><b>Loading Busan Planner…</b><p>Applying Rain Plan version on top of the original index.html.</p></div></div>
<script>
const ORIGINAL='https://cdn.jsdelivr.net/gh/loktoto/busan-trip@19ba1620a46d84cc564f6a33419e8d702ba89f13/index.html';
fetch(ORIGINAL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{
  html=html.replace(/<\/body>/i,'<script src="rain-patch.js?v=6f975a"><\\/script></body>');
  document.open();document.write(html);document.close();
}).catch(e=>{
  document.getElementById('boot').innerHTML='<div><b>Load failed</b><p>'+String(e.message)+'</p><p><a href="rain.html?v=19ba">Open rain preview</a></p></div>';
});
</script>
