<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Busan Planner</title><style>:root{--bg:#f6f4ee;--card:#fffefa;--ink:#101815;--muted:#66736d;--line:#e7e0d4;--brand:#0f766e;--b2:#115e59;--soft:#e5f5f1;--warn:#fff1c7;--bad:#ffe1dc;--sh:0 8px 22px rgba(20,30,25,.08);color-scheme:light}html[data-theme=dark]{--bg:#0e1412;--card:#151d1a;--ink:#edf4f0;--muted:#a2b0aa;--line:#283630;--brand:#2dd4bf;--b2:#8debe0;--soft:#173b37;--warn:#433510;--bad:#3f1916;--sh:0 10px 26px rgba(0,0,0,.32);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif;line-height:1.45}button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:10px 10px calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:-10px -10px 8px;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}.bar{display:flex;justify-content:space-between;gap:8px}.bar h1{font-size:25px;letter-spacing:-.055em;line-height:1;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.mini,.ghost{border:1px solid var(--line);background:var(--card);color:var(--b2);border-radius:999px;padding:7px 10px;font-size:12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 8px}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px}.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:16px}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 8px}.status h2{font-size:19px;line-height:1.1;letter-spacing:-.04em;margin:0}.status p{font-size:12px;color:var(--muted);margin:3px 0 0}.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}.img{width:100%;height:152px;object-fit:cover;display:block;background:var(--soft)}.body{padding:12px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.time{background:var(--soft);color:var(--b2);font-weight:850;border-radius:999px;padding:5px 9px;font-size:12px}.tag{font-size:11px;font-weight:760;background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border-radius:999px;padding:4px 7px}.tag.vbp{background:var(--warn);color:#a36a00}.tag.bad{background:var(--bad);color:#d35245}.card h3{font-size:18px;line-height:1.18;letter-spacing:-.035em;margin:8px 0 2px}.ko{font-size:13px;color:var(--b2);font-weight:760}.note,.meta{font-size:13px;color:var(--muted);margin:8px 0 0}.meta b{color:var(--ink)}.remark{margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--brand) 8%,transparent);font-size:13px;word-break:break-word}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.btn{border:0;background:var(--brand);color:#fff;border-radius:13px;min-height:39px;padding:8px;font-size:12px;font-weight:800}.btn.light{background:var(--card);color:var(--b2);border:1px solid var(--line)}.btn.red{background:#b42318;color:#fff}.editbox{display:none;margin-top:10px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--muted) 7%,transparent);border:1px dashed var(--line)}.editing .editbox{display:grid;gap:8px}.editing .movebar{display:grid}.field{display:grid;gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:9px;font-size:16px}.field textarea{min-height:68px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.movebar{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:#fff;font-weight:900}.done .check{background:var(--brand);border-color:var(--brand)}.done{opacity:.65}.bottom{position:fixed;left:10px;right:10px;bottom:max(9px,env(safe-area-inset-bottom));z-index:50;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:21px;padding:7px;box-shadow:0 12px 34px rgba(20,30,25,.18)}.bottom button{min-height:46px;border-radius:15px;border:0;font-weight:850}.edit,.add{background:var(--card);color:var(--b2);border:1px solid var(--line)!important}.save{background:var(--brand);color:#fff}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:#111814;color:#fff;border-radius:999px;padding:9px 13px;opacity:0;transition:.18s;z-index:70;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}.img{height:205px}}</style></head><body><main class="app"><header class="top"><div class="bar"><div><h1>釜山 5日4夜</h1><div class="sub" id="saveLine">DB connected</div></div><div><button class="mini" id="themeBtn">🌙</button><button class="mini" id="dbBtn">DB ✓</button></div></div><nav class="tabs" id="tabs"></nav><input class="search" id="search" placeholder="搜尋景點 / 韓文名 / Remark"></header><section class="status"><div><h2 id="heading">Day 1</h2><p id="count">Loading...</p></div><button class="ghost" id="copyBtn">Copy Sheet</button></section><section id="content"></section></main><nav class="bottom"><button class="edit" id="editBtn">✏️ Edit</button><button class="add" id="addBtn">＋ Add</button><button class="save" id="saveBtn">💾 Save</button></nav><div class="toast" id="toast">Saved</div><iframe name="hiddenFrame" style="display:none"></iframe><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';const BACKEND=atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3N2xlZnNoZ05nSEhBOTFFNlpfU1RnUWpBSmIxdzNFUldCZERFOGxidGNrODVFaVNMX1NUYmJiYWotTlJ5MGRyZDIvZXhlYw==');const KEY='busan2026';const H=['Day','Date','Start','End','TitleZH','TitleKO','LocationZH','LocationKO','AddressKO','Notes','Remark','VBP','Category','TravelTime','RainPlan','MapQueryKO','ImageUrl','PhotoCredit','LastSavedAt'];const STORE='busan-final-v2',THEME='busan-theme-v1',LAST='busan-last-save-v1';const DEF=[['Day 1','6/19 週五','06:00','','抵達金海國際機場','김해국제공항','金海國際機場','김해국제공항','','入境、取行李、T-money / 少量現金。','','','交通','約 60–75 分鐘去海雲台','','김해국제공항'],['Day 2','6/20 週六','09:15','11:15','甘川洞文化村','감천문화마을','甘川洞文化村','감천문화마을','','小王子、彩色屋、觀景位。早上去少人啲。','人多就縮短停留時間','','景點','約 25 分鐘去南浦','落雨改 ARTE / 百貨','부산 감천문화마을'],['Day 2','6/20 週六','20:00','20:15','廣安里 M 無人機燈光秀','광안리 M 드론라이트쇼','廣安里海水浴場','광안리해수욕장','','天氣差可能取消。可再睇 22:00 第二場。','出發前查官方狀態','','限定','約 25–35 分鐘返海雲台','取消就睇廣安大橋夜景','광안리 M 드론라이트쇼'],['Day 3','6/21 週日','10:00','10:45','天空膠囊列車：尾浦 → 青沙浦','스카이캡슐 / 미포정거장 → 청사포정거장','海雲台藍線公園','해운대블루라인파크','','要提前訂票。','Booking link 直接貼呢度','不包 / 另購','景點','約 10–15 分鐘步行去青沙浦','買唔到就改海岸列車 / 的士','스카이캡슐'],['Day 4','6/22 週一','08:40','10:00','海東龍宮寺','해동용궁사','海東龍宮寺','해동용궁사','','海邊寺廟，越早越少人。','','免費','景點','約 25–35 分鐘去機張市場','大雨改 Spa Land / X the Sky','해동용궁사'],['Day 5','6/23 週二','10:15','10:30','出發去金海國際機場','김해국제공항','金海國際機場','김해국제공항','','建議的士 / 包車。','11:30 左右到機場最穩','','交通','','','김해국제공항']].map(rowObj);const SPECIAL=[['Todo','','','','預約天空膠囊 스카이캡슐','스카이캡슐 예약','','','','盡早鎖定尾浦→青沙浦時段','Booking link 放 Remark','open','todo','','','스카이캡슐'],['Todo','','','','6/20 查廣安里無人機秀','광안리 드론쇼 확인','','','','天氣差可能取消；確認 20:00 / 22:00','出發前再 check 官方狀態','open','todo','','','광안리 M 드론라이트쇼'],['注意','','','','雨天 Plan B','우천 대안','','','','落雨優先：ARTE Museum、Busan X the Sky、Spa Land、百貨。','','','notice','','','']].map(rowObj);let rows=[],tab='Day 1',q='',editing=false;const $=id=>document.getElementById(id);initTheme();init();async function init(){rows=load(STORE,null)||DEF;render();try{if(!load(STORE,null)){let r=await fetch(CSV,{cache:'no-store'}),csv=await r.text(),got=csvObj(csv).filter(x=>x.Day&&x.TitleZH).map(norm);if(got.length)rows=got}}catch(e){}ensure();saveLocal(false);render()}function rowObj(a){let o={};H.forEach((h,i)=>o[h]=a[i]||'');return norm(o)}function norm(o){return {id:o.id||crypto.randomUUID(),Day:o.Day||'',Date:o.Date||'',Start:o.Start||'',End:o.End||'',TitleZH:o.TitleZH||'',TitleKO:o.TitleKO||'',LocationZH:o.LocationZH||'',LocationKO:o.LocationKO||'',AddressKO:o.AddressKO||'',Notes:o.Notes||'',Remark:o.Remark||'',VBP:o.VBP||'',Category:o.Category||'',TravelTime:o.TravelTime||'',RainPlan:o.RainPlan||'',MapQueryKO:o.MapQueryKO||o.LocationKO||o.TitleKO||o.TitleZH||'',ImageUrl:o.ImageUrl||'',PhotoCredit:o.PhotoCredit||'',LastSavedAt:o.LastSavedAt||''}}function ensure(){if(!rows.some(x=>x.Day==='Todo'))rows.push(...SPECIAL.filter(x=>x.Day==='Todo'));if(!rows.some(x=>x.Day==='注意'))rows.push(...SPECIAL.filter(x=>x.Day==='注意'))}function tabs(){let days=[...new Set(rows.filter(x=>!['Todo','注意'].includes(x.Day)).map(x=>x.Day).filter(Boolean))];$('tabs').innerHTML=[...days,'Todo','注意','Remark'].map(d=>`<button class="tab ${d===tab?'on':''}" onclick="tab=${JSON.stringify(d)};render()">${esc(d)}</button>`).join('')}function list(){let s=q.toLowerCase().trim(),base=tab==='Remark'?rows.filter(x=>x.Remark):rows.filter(x=>x.Day===tab);return base.filter(x=>!s||Object.values(x).join(' ').toLowerCase().includes(s))}function render(){document.body.classList.toggle('editing',editing);$('editBtn').textContent=editing?'✅ Done':'✏️ Edit';tabs();let a=list(),done=a.filter(x=>x.VBP==='done').length;$('heading').textContent=tab==='Todo'?'Todo List':tab==='注意'?'注意事項':tab==='Remark'?'Remark':`${tab} · ${(rows.find(x=>x.Day===tab)||{}).Date||''}`;$('count').textContent=tab==='Todo'?`${done}/${a.length} done${editing?' · editing':''}`:`${a.length} items${editing?' · editing':''}`;$('saveLine').textContent=`DB connected · Last saved: ${localStorage.getItem(LAST)||'not yet'}`;$('content').innerHTML=`<section class="list">${a.map(card).join('')||'<div class="card"><div class="body">搵唔到資料</div></div>'}</section>`;bind()}function cover(x){if(x.ImageUrl)return x.ImageUrl;let title=esc(x.TitleZH||'Busan'),ko=esc(x.TitleKO||'부산'),cat=esc(x.Category||'trip'),seed=Math.abs([...String(x.TitleZH+x.TitleKO)].reduce((a,c)=>a+c.charCodeAt(0),0))%360;let svg=`<svg xmlns='http://www.w3.org/2000/svg' width='900' height='520'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop stop-color='hsl(${seed},70%,38%)'/><stop offset='1' stop-color='hsl(${(seed+70)%360},65%,55%)'/></linearGradient></defs><rect width='900' height='520' fill='url(%23g)'/><circle cx='720' cy='80' r='170' fill='rgba(255,255,255,.18)'/><circle cx='120' cy='420' r='210' fill='rgba(255,255,255,.12)'/><text x='50' y='330' fill='white' font-size='62' font-family='Arial' font-weight='800'>${title}</text><text x='54' y='390' fill='rgba(255,255,255,.88)' font-size='34' font-family='Arial'>${ko}</text><text x='54' y='84' fill='rgba(255,255,255,.75)' font-size='28' font-family='Arial'>${cat}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+svg}function card(x){let todo=x.Day==='Todo',notice=x.Day==='注意',done=x.VBP==='done',time=`${x.Start||''}${x.End?'–'+x.End:''}`||x.Category||'item';return `<article class="card ${done?'done':''}">${!todo&&!notice?`<img class="img" src="${cover(x)}" width="900" height="520" loading="lazy">`:''}<div class="body"><div class="row"><span class="time">${esc(time)}</span>${todo?`<button class="check" onclick="toggleTodo(${JSON.stringify(x.id)})">${done?'✓':''}</button>`:`<span class="tag ${x.VBP?(x.VBP.includes('不確定')?'bad':'vbp'):''}">${esc(x.VBP||x.Category||'行程')}</span>`}</div><h3>${esc(x.TitleZH)}</h3><div class="ko">${esc(x.TitleKO)}</div>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}${x.Remark?`<div class="remark"><b>Remark</b><br>${linkify(x.Remark)}</div>`:''}${x.TravelTime?`<p class="meta"><b>→ 下一站：</b>${esc(x.TravelTime)}</p>`:''}${x.RainPlan?`<p class="meta"><b>雨天備案：</b>${esc(x.RainPlan)}</p>`:''}<div class="actions">${!todo&&!notice?`<button class="btn light" onclick="map('naver',${JSON.stringify(x.MapQueryKO||x.LocationKO||x.TitleKO)})">Naver</button><button class="btn light" onclick="map('kakao',${JSON.stringify(x.MapQueryKO||x.LocationKO||x.TitleKO)})">Kakao</button>`:''}<button class="btn light" onclick="copyKo(${JSON.stringify(x.id)})">韓文</button>${x.AddressKO?`<button class="btn light" onclick="copyText(${JSON.stringify(x.AddressKO)})">地址</button>`:''}</div><div class="editbox">${editFields(x)}<div class="movebar"><button class="btn light" onclick="step(${JSON.stringify(x.id)},-1)">↑ 上移</button><button class="btn light" onclick="step(${JSON.stringify(x.id)},1)">↓ 下移</button><button class="btn red" onclick="delItem(${JSON.stringify(x.id)})">Delete</button></div></div></div></article>`}function editFields(x){let inp=(f,l)=>`<div class="field"><label>${l}</label><input data-id="${x.id}" data-f="${f}" value="${esc(x[f]||'')}"></div>`,ta=(f,l)=>`<div class="field"><label>${l}</label><textarea data-id="${x.id}" data-f="${f}">${esc(x[f]||'')}</textarea></div>`;return `<div class="grid2">${inp('Day','Day')}${inp('Date','Date')}${inp('Start','Start')}${inp('End','End')}</div>${inp('TitleZH','中文標題')}${inp('TitleKO','韓文標題')}${inp('LocationZH','中文地點')}${inp('LocationKO','韓文地點')}${inp('AddressKO','AddressKO')}${ta('Notes','Notes')}${ta('Remark','Remark / Booking links')}${inp('VBP','VBP / done')}${inp('Category','分類')}${inp('TravelTime','TravelTime')}${inp('RainPlan','RainPlan')}${inp('MapQueryKO','地圖韓文搜尋')}${inp('ImageUrl','ImageUrl')}${inp('PhotoCredit','PhotoCredit')}`}function bind(){document.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{let x=rows.find(i=>i.id===el.dataset.id);if(x){x[el.dataset.f]=el.value;saveLocal(false)}})}function step(id,n){let a=list(),idx=a.findIndex(x=>x.id===id),other=a[idx+n];if(!other)return;let i=rows.findIndex(x=>x.id===id),j=rows.findIndex(x=>x.id===other.id);[rows[i],rows[j]]=[rows[j],rows[i]];saveLocal();render()}function delItem(id){if(confirm('Delete?')){rows=rows.filter(x=>x.id!==id);saveLocal();render()}}function add(){let d=tab==='Remark'?'注意':tab;rows.push(norm({Day:d,TitleZH:tab==='Todo'?'新 Todo':tab==='注意'?'新注意事項':tab==='Remark'?'新 Remark':'新行程',Remark:tab==='Remark'?'新備註':'',VBP:tab==='Todo'?'open':'',Category:tab==='Todo'?'todo':tab==='注意'||tab==='Remark'?'notice':'新增'}));editing=true;saveLocal();render()}function toggleTodo(id){let x=rows.find(i=>i.id===id);x.VBP=x.VBP==='done'?'open':'done';saveLocal();render()}function saveLocal(show=true){localStorage.setItem(STORE,JSON.stringify(rows));if(show)toast('Saved on phone')}function saveAll(){let t=stamp();rows.forEach(r=>r.LastSavedAt=t);localStorage.setItem(LAST,t);saveLocal(false);let data=rows.map(x=>{let r={};H.forEach(h=>r[h]=x[h]||'');return r});let f=document.createElement('form');f.method='POST';f.target='hiddenFrame';f.action=BACKEND;let i=document.createElement('textarea');i.name='payload';i.value=JSON.stringify({apiKey:KEY,rows:data});f.appendChild(i);document.body.appendChild(f);f.submit();f.remove();toast('Saved to Sheet');render()}function copySheet(show=true){let t=[H,...rows.map(x=>H.map(h=>x[h]||''))].map(r=>r.map(c=>String(c).replace(/\t|\n/g,' ')).join('\t')).join('\n');navigator.clipboard.writeText(t);if(show)toast('Copied Sheet')}function copyKo(id){let x=rows.find(i=>i.id===id);copyText([x.TitleKO,x.LocationKO].filter(Boolean).join(' / '))}function copyText(t){navigator.clipboard.writeText(t||'');toast('Copied')}function map(type,text){let qq=encodeURIComponent(text||'부산');if(type==='naver')openDeep(`nmap://search?query=${qq}&appname=busan.trip`,`https://map.naver.com/p/search/${qq}`);else openDeep(`kakaomap://search?q=${qq}`,`https://map.kakao.com/link/search/${qq}`)}function openDeep(app,web){let t=Date.now();location.href=app;setTimeout(()=>{if(Date.now()-t<1800)location.href=web},850)}function csvObj(csv){let a=parseCsv(csv),h=a[0]||[];return a.slice(1).map(r=>{let o={};h.forEach((k,i)=>o[k.trim()]=r[i]||'');return o})}function parseCsv(s){let rows=[],row=[],f='',qq=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(qq&&n==='"'){f+='"';i++}else qq=!qq}else if(c===','&&!qq){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!qq){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(x=>x.trim()))rows.push(row);row=[];f=''}else f+=c}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}function initTheme(){let saved=localStorage.getItem(THEME)||'light';document.documentElement.dataset.theme=saved}function toggleTheme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem(THEME,n);$('themeBtn').textContent=n==='dark'?'☀️':'🌙'}function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a style="color:var(--b2);font-weight:800" target="_blank" href="$1">$1</a>')}function stamp(){return new Date().toLocaleString('zh-HK',{hour12:false})}function load(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}$('search').oninput=e=>{q=e.target.value;render()};$('editBtn').onclick=()=>{editing=!editing;render()};$('addBtn').onclick=add;$('saveBtn').onclick=saveAll;$('copyBtn').onclick=()=>copySheet(true);$('dbBtn').onclick=()=>toast('DB link built in');$('themeBtn').onclick=toggleTheme;</script></body></html>
