<style>
:root{color-scheme:light;--bg:#f6f4ee;--card:#fffefa;--ink:#101815;--muted:#66736d;--line:#e7e0d4;--brand:#0f766e;--brand2:#115e59;--soft:#e5f5f1;--warn:#fff1c7;--bad:#ffe1dc;--shadow:0 8px 22px rgba(20,30,25,.08)}
html[data-theme=dark]{color-scheme:dark;--bg:#0e1412;--card:#151d1a;--ink:#edf4f0;--muted:#a2b0aa;--line:#283630;--brand:#2dd4bf;--brand2:#8debe0;--soft:#173b37;--warn:#453912;--bad:#421a16;--shadow:0 10px 26px rgba(0,0,0,.32)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","Noto Sans TC","Noto Sans KR",Arial,sans-serif;line-height:1.45}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;padding:10px 10px calc(94px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:-10px -10px 8px;padding:10px;background:var(--bg);border-bottom:1px solid var(--line)}.bar{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.bar h1{font-size:25px;line-height:1;letter-spacing:-.055em;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.topBtns{display:flex;gap:6px}.mini,.ghost{border:1px solid var(--line);background:var(--card);color:var(--brand2);border-radius:999px;padding:7px 10px;font-size:12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 8px;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px}.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:16px;outline:none}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 8px}.status h2{font-size:19px;line-height:1.1;letter-spacing:-.04em;margin:0}.status p{font-size:12px;color:var(--muted);margin:3px 0 0}.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.thumb{width:100%;height:150px;object-fit:cover;display:block;background:var(--soft)}.body{padding:12px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.time{background:var(--soft);color:var(--brand2);font-weight:850;border-radius:999px;padding:5px 9px;font-size:12px}.tag{font-size:11px;font-weight:760;background:rgba(120,120,120,.13);color:var(--muted);border-radius:999px;padding:4px 7px}.tag.vbp{background:var(--warn);color:#a36a00}.tag.bad{background:var(--bad);color:#d35245}.title{font-size:18px;line-height:1.18;letter-spacing:-.035em;margin:8px 0 2px}.ko{font-size:13px;color:var(--brand2);font-weight:760}.note,.meta{font-size:13px;color:var(--muted);margin:8px 0 0}.meta b{color:var(--ink)}.box{margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:12px;background:rgba(15,118,110,.08);font-size:13px;word-break:break-word}.box a{color:var(--brand2);font-weight:800}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.actions.two{grid-template-columns:1fr 1fr}.actions.one{grid-template-columns:1fr}.btn{border:0;background:var(--brand);color:#fff;border-radius:13px;min-height:39px;padding:8px;font-size:12px;font-weight:800}.btn.light{background:var(--card);color:var(--brand2);border:1px solid var(--line)}.btn.red{background:#b42318;color:#fff}.editbox{display:none;margin-top:10px;padding:10px;border-radius:14px;background:rgba(128,128,128,.07);border:1px dashed var(--line)}.editing .editbox{display:grid;gap:8px}.editing .movebar{display:grid}.field{display:grid;gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:850}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:9px;font-size:16px;outline:none}.field textarea{min-height:68px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.movebar{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:#fff;font-weight:900}.done .check{background:var(--brand);border-color:var(--brand)}.done{opacity:.68}.todoCard .row{align-items:center}.noticeCard .title,.materialCard .title{margin-top:4px}.bottom{position:fixed;left:10px;right:10px;bottom:max(9px,env(safe-area-inset-bottom));z-index:50;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:21px;padding:7px;box-shadow:0 12px 34px rgba(20,30,25,.18)}.bottom button{min-height:46px;border-radius:15px;border:0;font-weight:850}.edit,.add{background:var(--card);color:var(--brand2);border:1px solid var(--line)!important}.save{background:var(--brand);color:#fff}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:#111814;color:#fff;border-radius:999px;padding:9px 13px;opacity:0;transition:.18s;z-index:70;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}.thumb{height:205px}}
</style>

<main class="app">
<header class="top"><div class="bar"><div><h1>釜山 5日4夜</h1><div class="sub" id="saveLine">DB connected</div></div><div class="topBtns"><button class="mini" id="themeBtn">🌙</button><button class="mini" id="dbBtn">DB ✓</button></div></div><nav class="tabs" id="tabs"></nav><input class="search" id="search" placeholder="搜尋景點 / 韓文 / Material"></header>

<nav class="bottom"><button class="edit" id="editBtn">✏️ Edit</button><button class="add" id="addBtn">＋ Add</button><button class="save" id="saveBtn">💾 Save</button></nav><div class="toast" id="toast">Saved</div><iframe name="hiddenFrame" style="display:none"></iframe>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';
const BACKEND=atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3N2xlZnNoZ05nSEhBOTFFNlpfU1RnUWpBSmIxdzNFUldCZERFOGxidGNrODVFaVNMX1NUYmJiYWotTlJ5MGRyZDIvZXhlYw==');
const KEY='busan2026';
const H=['Day','Date','Start','End','TitleZH','TitleKO','LocationZH','LocationKO','AddressKO','Notes','Remark','VBP','Category','TravelTime','RainPlan','MapQueryKO','ImageUrl','PhotoCredit','LastSavedAt'];
const STORE='busan-stable-v2',THEME='busan-theme-v1',LAST='busan-last-save-v1';
const DEF=[
['Day 1','6/19 週五','06:00','','抵達金海國際機場','김해국제공항','金海國際機場','김해국제공항','','入境、取行李、T-money / 少量現金。','','','交通','約60–75分鐘去海雲台','','김해국제공항'],
['Day 2','6/20 週六','09:15','11:15','甘川洞文化村','감천문화마을','甘川洞文化村','감천문화마을','','小王子、彩色屋、觀景位。早上去少人啲。','https://www.visitbusan.net/','','景點','約20–30分鐘去南浦 / 影島','落雨改 ARTE Museum / 百貨','부산 감천문화마을'],
['Day 2','6/20 週六','20:00','20:15','廣安里 M 無人機燈光秀','광안리 M 드론라이트쇼','廣安里海水浴場','광안리해수욕장','','天氣差可能取消。出發前必查。','https://www.busan.go.kr/zht/bsevents','','限定','約25–35分鐘返海雲台','取消就睇廣安大橋夜景 / The Bay 101','광안리 M 드론라이트쇼'],
['Day 3','6/21 週日','10:00','10:45','天空膠囊列車：尾浦 → 青沙浦','스카이캡슐 / 미포정거장 → 청사포정거장','海雲台藍線公園','해운대블루라인파크','','要提前訂票。','https://www.bluelinepark.com/eng/','不包 / 另購','景點','約10–15分鐘步行去青沙浦','買唔到就改海岸列車 / 的士','스카이캡슐'],
['Day 4','6/22 週一','08:40','10:00','海東龍宮寺','해동용궁사','海東龍宮寺','해동용궁사','','海邊寺廟，越早越少人。','','免費','景點','約25–35分鐘去機張市場','大雨改 Spa Land / X the Sky','해동용궁사'],
['Day 5','6/23 週二','10:15','10:30','出發去金海國際機場','김해국제공항','金海國際機場','김해국제공항','','14:00 航班，唔排遠景點。','11:30 左右到機場最穩','','交通','','','김해국제공항']].map(rowObj);
const SPECIAL=[
['Todo','','','','預約天空膠囊','스카이캡슐 예약','','','','鎖定尾浦→青沙浦時段；訂完將 link 放 Remark。','https://www.bluelinepark.com/eng/','open','todo','','','스카이캡슐'],
['Todo','','','','出發前查廣安里無人機秀','광안리 드론쇼 확인','','','','天氣差可能取消；確認 20:00 / 22:00。','https://www.busan.go.kr/zht/bsevents','open','todo','','','광안리 M 드론라이트쇼'],
['Todo','','','','確認 VBP 啟動時間','VBP 확인','','','','建議 Day 2 ARTE Museum 開始用。','https://www.visitbusanpass.com/','open','todo','','','visit busan pass'],
['注意','','','','Day 5 離境 buffer','출국일 버퍼','','','','14:00 飛；建議 10:15 海雲台出發，11:30 到機場。','','','notice','','',''],
['注意','','','','VBP 風險','VBP 주의','','','','遊艇 VBP 可用性唔穩；唔好當必定免費。','','','notice','','',''],
['注意','','','','雨天 Plan B','우천 대안','','','','落雨優先：ARTE Museum、Busan X the Sky、Spa Land、百貨。','','','notice','','',''],
['Material','','','','Blue Line Park / 天空膠囊','해운대블루라인파크','','','','官方網站 / 訂票入口','https://www.bluelinepark.com/eng/','','material','','','스카이캡슐'],
['Material','','','','Visit Busan Pass','비짓부산패스','','','','查 VBP 包唔包、啟用規則','https://www.visitbusanpass.com/','','material','','','visit busan pass'],
['Material','','','','ARTE Museum Busan','아르떼뮤지엄 부산','','','','室內雨天 plan / VBP 高價值項目','https://artemuseum.com/BUSAN','','material','','','아르떼뮤지엄 부산'],
['Material','','','','廣安里活動 / 無人機狀態','광안리 드론쇼','','','','出發前查天氣取消資訊','https://www.busan.go.kr/zht/bsevents','','material','','','광안리 M 드론라이트쇼'],
['Material','','','','Skyline Luge Busan','스카이라인루지 부산','','','','營業時間 / 票務','https://busan.skylineluge.kr/en/','','material','','','스카이라인루지 부산']].map(rowObj);
let rows=[],tab='Day 1',q='',editing=false;const $=id=>document.getElementById(id);
initTheme();init();
async function init(){rows=DEF;render();try{const r=await fetch(CSV,{cache:'no-store'});const csv=await r.text();const got=csvObj(csv).filter(x=>x.Day&&x.TitleZH).map(norm).map(hydrate);if(got.length)rows=got}catch(e){const local=load(STORE,null);if(local)rows=local}ensure();rows=rows.map(hydrate);saveLocal(false);render()}
function rowObj(a){let o={};H.forEach((h,i)=>o[h]=a[i]||'');return norm(o)}
function norm(o){return {id:o.id||crypto.randomUUID(),Day:o.Day||'',Date:o.Date||'',Start:o.Start||'',End:o.End||'',TitleZH:o.TitleZH||'',TitleKO:o.TitleKO||'',LocationZH:o.LocationZH||'',LocationKO:o.LocationKO||'',AddressKO:o.AddressKO||'',Notes:o.Notes||'',Remark:o.Remark||o.Material||'',VBP:o.VBP||'',Category:o.Category||'',TravelTime:o.TravelTime||'',RainPlan:o.RainPlan||'',MapQueryKO:o.MapQueryKO||o.LocationKO||o.TitleKO||o.TitleZH||'',ImageUrl:o.ImageUrl||'',PhotoCredit:o.PhotoCredit||'',LastSavedAt:o.LastSavedAt||''}}
function hydrate(x){const t=(x.TitleZH+' '+x.TitleKO+' '+x.MapQueryKO).toLowerCase();if(!x.TravelTime){if(t.includes('공항')||t.includes('機場'))x.TravelTime=x.Day==='Day 5'?'約45–60分鐘去機場':'約60–75分鐘去海雲台';else if(t.includes('감천'))x.TravelTime='約20–30分鐘去南浦 / 影島';else if(t.includes('광안'))x.TravelTime='約25–35分鐘返海雲台';else if(t.includes('스카이캡슐'))x.TravelTime='約10–15分鐘步行去青沙浦';else if(t.includes('용궁사'))x.TravelTime='約25–35分鐘去機張市場'}if(!x.RainPlan){if(t.includes('감천'))x.RainPlan='落雨改 ARTE Museum / 百貨';else if(t.includes('광안'))x.RainPlan='取消就睇廣安大橋夜景 / The Bay 101';else if(t.includes('스카이캡슐'))x.RainPlan='買唔到就改海岸列車 / 的士';else if(t.includes('용궁사'))x.RainPlan='大雨改 Spa Land / X the Sky'}return x}
function ensure(){if(!rows.some(x=>x.Day==='Todo'))rows.push(...SPECIAL.filter(x=>x.Day==='Todo'));if(!rows.some(x=>x.Day==='注意'))rows.push(...SPECIAL.filter(x=>x.Day==='注意'));if(!rows.some(x=>x.Day==='Material'))rows.push(...SPECIAL.filter(x=>x.Day==='Material'))}
function days(){const standard=['Day 1','Day 2','Day 3','Day 4','Day 5'];const existing=new Set(rows.map(x=>x.Day));return standard.filter(d=>existing.has(d))}
function tabs(){const ds=[...days(),'Todo','注意','Material'];$('tabs').innerHTML=ds.map(d=>`<button class="tab ${d===tab?'on':''}" data-tab="${escAttr(d)}">${esc(d)}</button>`).join('')}
function list(){const s=q.toLowerCase().trim();return rows.filter(x=>x.Day===tab).filter(x=>!s||Object.values(x).join(' ').toLowerCase().includes(s))}
function render(){document.body.classList.toggle('editing',editing);$('editBtn').textContent=editing?'✅ Done':'✏️ Edit';tabs();const a=list(),done=a.filter(x=>x.VBP==='done').length;$('heading').textContent=tab==='Todo'?'Todo List':tab==='注意'?'注意事項':tab==='Material'?'Material':`${tab} · ${(rows.find(x=>x.Day===tab)||{}).Date||''}`;$('count').textContent=tab==='Todo'?`${done}/${a.length} done${editing?' · editing':''}`:`${a.length} items${editing?' · editing':''}`;$('saveLine').textContent=`DB connected · Last saved: ${localStorage.getItem(LAST)||'not yet'}`;$('content').innerHTML=`<section class="list">${a.map(card).join('')||'<div class="card"><div class="body">搵唔到資料</div></div>'}</section>`;bind()}
function card(x){if(x.Day==='Todo')return todoCard(x);if(x.Day==='注意')return noticeCard(x);if(x.Day==='Material')return materialCard(x);return dayCard(x)}
function imgHtml(x){return x.ImageUrl?`<img class="thumb" data-img="1" src="${escAttr(x.ImageUrl)}" width="900" height="520" loading="lazy">`:''}
function dayCard(x){const time=`${x.Start||''}${x.End?'–'+x.End:''}`||x.Category||'item';return `<article class="card" data-id="${escAttr(x.id)}">${imgHtml(x)}<div class="body"><div class="row"><span class="time">${esc(time)}</span><span class="tag ${x.VBP?(x.VBP.includes('不確定')?'bad':'vbp'):''}">${esc(x.VBP||x.Category||'行程')}</span></div><h3 class="title">${esc(x.TitleZH)}</h3><div class="ko">${esc(x.TitleKO)}</div>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}${x.Remark?`<div class="box"><b>Material</b><br>${linkify(x.Remark)}</div>`:''}${x.TravelTime?`<p class="meta"><b>→ 下一站：</b>${esc(x.TravelTime)}</p>`:''}${x.RainPlan?`<p class="meta"><b>雨天備案：</b>${esc(x.RainPlan)}</p>`:''}<div class="actions"><button class="btn light" data-action="naver">Naver</button><button class="btn light" data-action="kakao">Kakao</button><button class="btn light" data-action="copyko">韓文</button>${x.AddressKO?`<button class="btn light" data-action="copyaddr">地址</button>`:''}</div>${editBox(x)}</div></article>`}
function todoCard(x){const done=x.VBP==='done';return `<article class="card todoCard ${done?'done':''}" data-id="${escAttr(x.id)}"><div class="body"><div class="row"><div><h3 class="title">${esc(x.TitleZH)}</h3>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}</div><button class="check" data-action="toggle">${done?'✓':''}</button></div>${editBox(x)}</div></article>`}
function noticeCard(x){return `<article class="card noticeCard" data-id="${escAttr(x.id)}"><div class="body"><h3 class="title">${esc(x.TitleZH)}</h3>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}${editBox(x)}</div></article>`}
function materialCard(x){return `<article class="card materialCard" data-id="${escAttr(x.id)}"><div class="body"><h3 class="title">${esc(x.TitleZH)}</h3><div class="ko">${esc(x.TitleKO)}</div>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}${x.Remark?`<div class="box">${linkify(x.Remark)}</div>`:''}<div class="actions ${x.Remark?'two':'one'}">${x.Remark?`<button class="btn light" data-action="openmat">Open</button>`:''}<button class="btn light" data-action="copyko">Copy</button></div>${editBox(x)}</div></article>`}
function editBox(x){return `<div class="editbox">${editFields(x)}<div class="movebar"><button class="btn light" data-action="up">↑ 上移</button><button class="btn light" data-action="down">↓ 下移</button><button class="btn red" data-action="delete">Delete</button></div></div>`}
function editFields(x){const inp=(f,l)=>`<div class="field"><label>${l}</label><input data-id="${escAttr(x.id)}" data-f="${escAttr(f)}" value="${escAttr(x[f]||'')}"></div>`;const ta=(f,l)=>`<div class="field"><label>${l}</label><textarea data-id="${escAttr(x.id)}" data-f="${escAttr(f)}">${esc(x[f]||'')}</textarea></div>`;return `<div class="grid2">${inp('Day','Day')}${inp('Date','Date')}${inp('Start','Start')}${inp('End','End')}</div>${inp('TitleZH','中文標題')}${inp('TitleKO','韓文標題')}${inp('LocationZH','中文地點')}${inp('LocationKO','韓文地點')}${inp('AddressKO','AddressKO')}${ta('Notes','Notes')}${ta('Remark','Remark / Material links')}${inp('VBP','VBP / done')}${inp('Category','分類')}${inp('TravelTime','TravelTime')}${inp('RainPlan','RainPlan')}${inp('MapQueryKO','地圖韓文搜尋')}${inp('ImageUrl','ImageUrl')}`}
function bind(){document.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{const x=rows.find(i=>i.id===el.dataset.id);if(x){x[el.dataset.f]=el.value;saveLocal(false)}});document.querySelectorAll('[data-img]').forEach(img=>img.onerror=()=>img.remove())}
function handleAction(action,id){const x=rows.find(i=>i.id===id);if(!x)return;if(action==='toggle')toggleTodo(id);if(action==='naver')map('naver',x.MapQueryKO||x.LocationKO||x.TitleKO);if(action==='kakao')map('kakao',x.MapQueryKO||x.LocationKO||x.TitleKO);if(action==='copyko')copyText([x.TitleKO,x.LocationKO,x.Remark].filter(Boolean).join(' / '));if(action==='copyaddr')copyText(x.AddressKO);if(action==='openmat')openFirstUrl(x.Remark);if(action==='up')step(id,-1);if(action==='down')step(id,1);if(action==='delete')delItem(id)}
function step(id,n){const a=list(),idx=a.findIndex(x=>x.id===id),other=a[idx+n];if(!other)return;const i=rows.findIndex(x=>x.id===id),j=rows.findIndex(x=>x.id===other.id);[rows[i],rows[j]]=[rows[j],rows[i]];saveLocal();render()}
function delItem(id){if(confirm('Delete?')){rows=rows.filter(x=>x.id!==id);saveLocal();render()}}
function add(){const d=tab;rows.push(norm({Day:d,TitleZH:tab==='Todo'?'新 Todo':tab==='注意'?'新注意事項':tab==='Material'?'新 Material':'新行程',VBP:tab==='Todo'?'open':'',Category:tab.toLowerCase()}));editing=true;saveLocal();render()}
function toggleTodo(id){const x=rows.find(i=>i.id===id);x.VBP=x.VBP==='done'?'open':'done';saveLocal();render()}
function saveLocal(show=true){localStorage.setItem(STORE,JSON.stringify(rows));if(show)toast('Saved on phone')}
function saveAll(){const t=stamp();rows.forEach(r=>r.LastSavedAt=t);localStorage.setItem(LAST,t);saveLocal(false);const data=rows.map(x=>{let r={};H.forEach(h=>r[h]=x[h]||'');return r});const f=document.createElement('form');f.method='POST';f.target='hiddenFrame';f.action=BACKEND;const i=document.createElement('textarea');i.name='payload';i.value=JSON.stringify({apiKey:KEY,rows:data});f.appendChild(i);document.body.appendChild(f);f.submit();f.remove();toast('Saved to Sheet');render()}
function copySheet(show=true){const t=[H,...rows.map(x=>H.map(h=>x[h]||''))].map(r=>r.map(c=>String(c).replace(/\t|\n/g,' ')).join('\t')).join('\n');copyText(t);if(show)toast('Copied Sheet')}
function copyText(t){navigator.clipboard.writeText(t||'');toast('Copied')}
function openFirstUrl(t){const m=String(t||'').match(/https?:\/\/[^\s]+/);if(m)window.open(m[0],'_blank');else toast('No link')}
function map(type,text){const qq=encodeURIComponent(text||'부산');if(type==='naver')openDeep(`nmap://search?query=${qq}&appname=busan.trip`,`https://map.naver.com/p/search/${qq}`);else openDeep(`kakaomap://search?q=${qq}`,`https://map.kakao.com/link/search/${qq}`)}
function openDeep(app,web){const t=Date.now();location.href=app;setTimeout(()=>{if(Date.now()-t<1800)location.href=web},850)}
function csvObj(csv){const a=parseCsv(csv),h=a[0]||[];return a.slice(1).map(r=>{let o={};h.forEach((k,i)=>o[k.trim()]=r[i]||'');return o})}
function parseCsv(s){let rows=[],row=[],f='',qq=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(c==='"'){if(qq&&n==='"'){f+='"';i++}else qq=!qq}else if(c===','&&!qq){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!qq){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(x=>x.trim()))rows.push(row);row=[];f=''}else f+=c}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function initTheme(){const saved=localStorage.getItem(THEME)||'light';document.documentElement.dataset.theme=saved;setThemeButton()}
function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem(THEME,n);setThemeButton()}
function setThemeButton(){$('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a target="_blank" href="$1">$1</a>')}
function stamp(){return new Date().toLocaleString('zh-HK',{hour12:false})}
function load(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escAttr(v){return esc(v).replace(/`/g,'&#096;')}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()});
$('content').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const c=b.closest('.card');if(c)handleAction(b.dataset.action,c.dataset.id)});
$('search').oninput=e=>{q=e.target.value;render()};$('editBtn').onclick=()=>{editing=!editing;render()};$('addBtn').onclick=add;$('saveBtn').onclick=saveAll;$('copyBtn').onclick=()=>copySheet(true);$('dbBtn').onclick=()=>toast('DB link built in');$('themeBtn').onclick=toggleTheme;
</script>
</body></html>
