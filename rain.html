<!doctype html><html lang='zh-HK'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>釜山 Rain Plan</title><style>:root{--bg:#0b1110;--card:#121b18;--ink:#f2f6f3;--muted:#9aa9a3;--line:#273630;--brand:#2dd4bf;--brand2:#5eead4;--soft:#153b36;--rain:#1d3557;--rest:#3b2f1c;--shadow:0 16px 34px rgba(0,0,0,.34)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}.app{max-width:780px;margin:auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:30;margin:-12px -12px 12px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(0,0,0,.18)}.bar{display:flex;justify-content:space-between;gap:10px}.bar h1{font-size:30px;line-height:1;margin:0;letter-spacing:-.06em}.sub,.muted,.note,.meta{color:var(--muted);font-size:13px}.scroller{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:9px 0}.scroller::-webkit-scrollbar{display:none}.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;min-height:44px;padding:9px 14px;font-weight:850;white-space:nowrap;word-break:keep-all;line-height:1.08}.pill small{display:block;color:var(--muted);font-weight:800;font-size:11px;margin-top:2px}.on{background:var(--brand)!important;color:#06201b!important;border-color:var(--brand)!important}.on small{color:#06362f}.status{display:flex;justify-content:space-between;align-items:flex-start;margin:10px 2px}.status h2{font-size:24px;margin:0;letter-spacing:-.04em}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}.body{padding:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.time,.tag{font-size:12px;font-weight:850;border-radius:999px;padding:5px 9px;background:rgba(120,120,120,.14);color:var(--muted);white-space:nowrap}.time{background:var(--soft);color:var(--brand)}.title{font-size:20px;line-height:1.15;letter-spacing:-.04em;margin:10px 0 3px;font-weight:950}.ko{color:var(--brand);font-weight:850}.note{margin:9px 0 0}.rain{margin-top:12px;border:1px solid rgba(93,173,226,.28);background:linear-gradient(135deg,rgba(29,53,87,.88),rgba(21,59,54,.68));border-radius:16px;padding:11px 12px;color:#edf7ff}.rain b{display:block;color:#a7d8ff;font-size:12px;letter-spacing:.05em;margin-bottom:4px}.rain div{font-size:14px}.rest{margin-top:10px;border:1px solid rgba(245,158,11,.22);background:rgba(59,47,28,.78);border-radius:14px;padding:10px}.rest b{color:#ffd082;font-size:12px}.rest p{margin:4px 0 0;color:#fff3d6;font-size:13px}.transport{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 14px 36px rgba(0,0,0,.22)}.bottom button{min-height:50px;border:0;border-radius:17px;font-weight:900}.ghost{background:var(--soft);color:var(--brand)}@media(max-width:480px){.app{padding-left:10px;padding-right:10px}.bar h1{font-size:30px}.title{font-size:19px}.body{padding:14px}.rain div{font-size:13.5px}}</style></head><body><main class='app'><header class='top'><div class='bar'><div><h1>釜山 5日4夜</h1><div class='sub'>Rain Plan preview · index.html 未改</div></div></div><nav class='scroller' id='tabs'></nav></header><section class='status'><div><h2 id='head'>Day 1</h2><p id='count' class='muted'></p></div><button class='pill' id='copy'>Copy</button></section><section id='list'></section></main><nav class='bottom'><button class='ghost' id='prev'>← Prev</button><button class='ghost' id='next'>Next →</button><button class='ghost' onclick='location.href="index.html"'>Index</button></nav><script>const DAYS=[{id:'Day 1',date:'6/19 Fri',route:'金海機場 → 海雲台 → 南浦 / 札嘎其 → 海雲台',items:[['06:00','抵達金海國際機場','Gimhae International Airport · 김해국제공항','入境、取行李、買 T-money / eSIM。','雨天無大問題；如果落大雨，直接用的士去酒店，唔好拖行李轉太多站。','機場 → 海雲台，的士約45–70分鐘；公共交通約75–90分鐘。'],['07:30','海雲台酒店放低行李','Haeundae hotel · 해운대 호텔','先放行李，首日早機唔建議即刻重行程。','大雨就留酒店附近食早餐，等雨細先出去，避免拖喼濕身。','海雲台區內短程的士 / 步行。'],['09:00','海雲台傳統市場早餐','Haeundae Traditional Market · 해운대전통시장','早餐、小食、簡單逛市場。','市場有部分遮蓋但唔係全室內；大雨可改附近 café / hotel breakfast。','酒店附近步行為主。','攤檔 / 餐廳營業時間視乎店舖；當日用 Naver 確認。'],['13:00','南浦洞 / 札嘎其市場','Nampo-dong / Jagalchi · 남포동 / 자갈치시장','午餐、札嘎其市場、海鮮街。','雨天可照行：札嘎其市場大樓、南浦地下街、樂天百貨光復店都順路。','海雲台 → 札嘎其，地鐵約60–70分鐘。','海鮮餐廳建議早少少去；實際營業時間逐間確認。']]},{id:'Day 2',date:'6/20 Sat',route:'海雲台 → 甘川 → 南浦 / 影島 → ARTE → 廣安里',items:[['08:00','甘川文化村','Gamcheon Culture Village · 감천문화마을','山坡路多，適合早上去。','中雨以上唔建議慢行山坡；改 ARTE 早入場，甘川縮短做30–45分鐘影相位。','海雲台 → 甘川約70–90分鐘；最後一段的士最順。'],['11:30','南浦 / BIFF 午餐','Nampo / BIFF lunch · 남포동 / BIFF광장','南浦食午餐，為14:00影島大橋做 buffer。','雨天照去，選室內餐廳；唔好揀要排露天隊嘅店。','甘川 → 南浦約20–30分鐘。','餐廳營業時間逐間不同；熱門店建議用 Naver check。'],['13:20','影島大橋開橋位','Yeongdo Bridge · 영도대교 도개','14:00–14:15 表演；錯過就唔等。','小雨可睇；大雨就改樂天光復店內休息 / 觀景，唔好企戶外等太耐。','南浦 / 樂天光復店附近步行。'],['15:20','ARTE Museum Busan','ARTE Museum Busan · 아르떼뮤지엄 부산','室內光影展，雨天最穩陣。','雨天主力景點；如果甘川取消，就直接加長 ARTE 時間。','影島大橋 → ARTE，的士約10–15分鐘。'],['18:30','廣安里晚餐 + 無人機燈光秀','Gwangalli + Drone show · 광안리 / 드론라이트쇼','Saturday 固定重點，但受天氣影響。','無人機 show 遇雨 / 強風可能取消；直接改廣安里室內餐廳 / café，或去 Centum City / Spa Land。','ARTE → 廣安里約40–55分鐘。','海景餐廳建議預約；當日再確認營業時間。']]},{id:'Day 3',date:'6/21 Sun',route:'海雲台 → X the Sky → 尾浦 → 青沙浦 → 海雲台',items:[['10:00','海雲台海灘 / 冬柏島','Haeundae Beach / Dongbaek · 해운대해수욕장 / 동백섬','輕鬆散步，唔好太趕。','落雨就改 SEA LIFE Busan Aquarium / café；冬柏島濕滑就取消。','海雲台區內步行。'],['11:45','海理團路午餐 / 咖啡','Haeridan-gil · 해리단길','補體力，為下午藍線公園留 buffer。','雨天照去，揀近地鐵 / 的士落車位嘅室內店。','海雲台區內步行 / 短程的士。','餐廳 / café 營業時間逐間不同；午餐位建議先 mark backup。'],['13:30','Busan X the Sky','Busan X the Sky · 부산엑스더스카이','觀景台，天氣清先值得留耐。','如果能見度差，縮短參觀；改去 café / SEA LIFE / 新世界 Centum City。','海雲台海灘 → LCT約10–15分鐘步行。'],['15:30','Beach Train：尾浦 → 青沙浦','Beach Train · 해변열차 미포→청사포','順路去青沙浦，之後等天空膠囊。','小雨可照搭；雷雨 / 強風留意停駛，改 Mipo / 青沙浦 café 等候或取消。','X the Sky → Mipo約10分鐘步行。'],['18:30','Sky Capsule：青沙浦 → 尾浦','Sky Capsule · 스카이캡슐 청사포→미포','黃昏班次，最重要預約。','小雨景色仍可；強風 / 雷雨可能停運，保留 Beach Train / 的士回海雲台方案。','青沙浦 → 尾浦約30分鐘。']]},{id:'Day 4',date:'6/22 Mon',route:'海雲台 → 海東龍宮寺 → 機張 / Osiria → 西面 / 田浦',items:[['08:00','海東龍宮寺','Haedong Yonggungsa · 해동용궁사','海邊寺廟，早去避人潮。','中雨以上縮短 / 取消；改 Busan National Science Museum 或 Lotte Mall Dongbusan，兩個都同區順路。','海雲台 → 龍宮寺約35–55分鐘。'],['10:30','機張市場午餐','Gijang Market · 기장시장','食海鮮 / 蟹，留意唔好食太耐影響 Luge。','雨天照去，市場 / 餐廳相對可行；建議的士上落車。','龍宮寺 → 機張市場約15–25分鐘。','海鮮店營業時間逐間不同；午餐比晚餐穩陣。'],['12:50','Skyline Luge Busan','Skyline Luge · 스카이라인루지 부산','戶外活動，天氣好先值得。','雨天 / 大風可能停；改 Lotte Mall Dongbusan / Busan National Science Museum，完全順路。','機張市場 → Luge約15–25分鐘。'],['19:00','田浦咖啡街 + 西面晚餐','Jeonpo + Seomyeon · 전포카페거리 / 서면','晚上轉市區，較多室內選擇。','雨天仍可行；用地鐵站 / 地下街連接，減少露天步行。','海雲台 / 機張 → 西面約45–70分鐘。','晚餐 / café 營業時間逐間不同；西面選擇多。']]},{id:'Day 5',date:'6/23 Tue',route:'海雲台 → 金海機場',items:[['08:30','海雲台早餐 / 最後散步','Haeundae breakfast / last walk · 해운대 아침 산책','最後輕量行程。','雨天取消散步，直接 café / 酒店早餐，早少少出機場。','海雲台區內。','早餐店營業時間逐間不同；建議揀酒店附近。'],['09:30','回酒店取行李','Pick up luggage · 호텔 짐 찾기','唔好再加景點。','大雨預多15–20分鐘 call taxi。','酒店內 / 附近。'],['10:15','出發去金海國際機場','Leave for Gimhae Airport · 김해국제공항으로 이동','14:00 flight，11:30左右到機場較穩陣。','雨天 / 塞車就10:00前出發。','海雲台 → 機場，的士約45–70分鐘；公共交通約75–90分鐘。']]}];let cur=0;const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m==='"'?'&quot;':'&#39;');function tabs(){tabsEl.innerHTML=DAYS.map((d,i)=>'<button class="pill '+(i===cur?'on':'')+'" onclick="cur='+i+';render()">'+d.id+'<small>'+d.date+'</small></button>').join('')}function card(x){return '<article class="card"><div class="body"><div class="row"><div><span class="time">'+esc(x[0])+'</span><h3 class="title">'+esc(x[1])+'</h3><div class="ko">'+esc(x[2])+'</div></div></div><p class="note">'+esc(x[3])+'</p>'+(x[6]?'<div class="rest"><b>餐廳資料</b><p>'+esc(x[6])+'</p></div>':'')+'<div class="rain"><b>☔ Rain Plan</b><div>'+esc(x[4])+'</div></div><div class="transport">順路交通：'+esc(x[5])+'</div></div></article>'}function render(){tabs();let d=DAYS[cur];head.textContent=d.id+' · '+d.date;count.textContent=d.route+' · '+d.items.length+' stops';list.innerHTML=d.items.map(card).join('');window.scrollTo({top:0,behavior:'smooth'})}const tabsEl=$('tabs'),head=$('head'),count=$('count'),list=$('list');$('prev').onclick=()=>{cur=Math.max(0,cur-1);render()};$('next').onclick=()=>{cur=Math.min(DAYS.length-1,cur+1);render()};$('copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(location.href);render();</script></body></html>
