<!doctype html><html lang='zh-HK'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>釜山 Rain Plan</title><style>:root{--bg:#0b1110;--card:#121b18;--ink:#f2f6f3;--muted:#9aa9a3;--line:#273630;--brand:#2dd4bf;--brand2:#5eead4;--soft:#153b36;--warn:#443812;--bad:#421a16;--shadow:0 16px 34px rgba(0,0,0,.34)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}.app{max-width:780px;margin:auto;padding:12px 12px calc(112px + env(safe-area-inset-bottom))}button,input{font:inherit}.top{position:sticky;top:0;z-index:30;margin:-12px -12px 12px;padding:calc(12px + env(safe-area-inset-top)) 12px 12px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(0,0,0,.18)}.bar{display:flex;justify-content:space-between;gap:10px}.bar h1{font-size:30px;line-height:1;margin:0;letter-spacing:-.06em}.sub,.muted,.note,.meta,.smallText{color:var(--muted);font-size:13px}.mini,.pill,.btn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;min-height:44px;padding:9px 14px;font-weight:850}.mini{min-width:46px;padding:0}.scroller{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:9px 0}.scroller::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;white-space:nowrap;word-break:keep-all;line-height:1.08;min-width:max-content}.pill small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.on{background:var(--brand)!important;color:#06201b!important;border-color:var(--brand)!important}.on small{color:#06362f}.search{width:100%;min-height:50px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:12px 14px;font-size:16px}.status{display:flex;justify-content:space-between;align-items:flex-start;margin:10px 2px}.status h2{font-size:24px;margin:0;letter-spacing:-.04em}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}.body{padding:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.time,.tag{font-size:12px;font-weight:850;border-radius:999px;padding:5px 9px;background:rgba(120,120,120,.14);color:var(--muted);white-space:nowrap}.time{background:var(--soft);color:var(--brand)}.vbp{background:var(--warn);color:#d9a700}.title{font-size:20px;line-height:1.15;letter-spacing:-.04em;margin:10px 0 3px;font-weight:950}.restaurant .title{font-size:21px}.ko{color:var(--brand);font-weight:850}.note,.meta{margin:9px 0 0}.rain{margin-top:12px;border:1px solid rgba(93,173,226,.28);background:linear-gradient(135deg,rgba(29,53,87,.88),rgba(21,59,54,.68));border-radius:16px;padding:11px 12px;color:#edf7ff}.rain b{display:block;color:#a7d8ff;font-size:12px;letter-spacing:.05em;margin-bottom:4px}.rain div{font-size:14px;line-height:1.45}.restInfo{margin-top:10px;border:1px solid rgba(245,158,11,.22);background:rgba(59,47,28,.78);border-radius:14px;padding:10px}.restInfo b{color:#ffd082;font-size:12px}.restInfo div{margin-top:4px;color:#fff3d6;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.btn{border-radius:15px;text-align:center;text-decoration:none}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 14px 36px rgba(0,0,0,.22)}.bottom button{min-height:50px;border:0;border-radius:17px;font-weight:900}.ghost{background:var(--soft);color:var(--brand)}.empty{padding:38px 10px;text-align:center;color:var(--muted)}@media(max-width:480px){.app{padding-left:10px;padding-right:10px}.bar h1{font-size:30px}.title{font-size:19px}.actions{grid-template-columns:1fr 1fr}.body{padding:14px}.rain div{font-size:13.5px}}</style></head><body><main class='app'><header class='top'><div class='bar'><div><h1>釜山 5日4夜</h1><div class='sub'>Rain Plan preview · same Sheet data / tabs · index.html 未改</div></div><button class='mini' onclick='location.href="index.html"'>↩</button></div><nav class='scroller' id='tabs'></nav><input class='search' id='search' placeholder='搜尋景點 / 韓文 / 餐廳 / Todo / Material'></header><section class='status'><div><h2 id='head'>Day 1</h2><p id='count' class='muted'>Loading</p></div><button class='pill' id='copy'>Copy</button></section><section id='list'></section></main><nav class='bottom'><button class='ghost' id='prev'>← Prev</button><button class='ghost' id='next'>Next →</button><button class='ghost' onclick='location.href="index.html"'>Index</button></nav><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';const H='Day,Date,Start,End,TitleZH,TitleKO,LocationZH,LocationKO,Notes,VBP,Category,MapQueryKO,ImageUrl,PhotoCredit,Remark,AddressKO,TravelTime,RainPlan,LastSavedAt,RestaurantID,Cuisine,Signature,Area,NearestStation,PriceKRW,Michelin2026,BlueRibbon,IGThreadsHot,BlackSpoon,Priority,DataStatus,SourceURL,ReservationURL,OpeningHours,ClosedDays,Lat,Lng,MapVerified,NaverPlaceUrl,KakaoPlaceUrl'.split(',');const DATES={'Day 1':'6/19 Fri','Day 2':'6/20 Sat','Day 3':'6/21 Sun','Day 4':'6/22 Mon','Day 5':'6/23 Tue'};const TABS=['Day 1','Day 2','Day 3','Day 4','Day 5','餐廳','Todo','Material','注意'];const FALLBACK=[['金海國際機場','雨天無大問題；如果落大雨，直接用的士去酒店，唔好拖行李轉太多站。'],['海雲台傳統市場','市場有部分遮蓋但唔係全室內；大雨可改附近 café / hotel breakfast。'],['札嘎其','雨天可照行：札嘎其市場大樓、南浦地下街、樂天百貨光復店都順路。'],['BIFF','大雨就縮短 BIFF / 國際市場，轉南浦地下街 + 樂天光復店，唔使折返。'],['甘川','中雨以上唔建議慢行山坡；改 ARTE 早入場，甘川縮短做30–45分鐘影相位。'],['影島大橋','小雨可睇；大雨就改樂天光復店內休息 / 觀景，唔好企戶外等太耐。'],['ARTE','雨天主力景點；如果甘川取消，就直接加長 ARTE 時間。'],['廣安里','無人機 show 遇雨 / 強風可能取消；直接改廣安里室內餐廳 / café，或去 Centum City / Spa Land。'],['海雲台海灘','落雨就改 SEA LIFE Busan Aquarium / café；冬柏島濕滑就取消。'],['Busan X','如果能見度差，縮短參觀；改去 café / SEA LIFE / 新世界 Centum City。'],['Beach Train','小雨可照搭；雷雨 / 強風留意停駛，改 Mipo / 青沙浦 café 等候或取消。'],['Sky Capsule','小雨景色仍可；強風 / 雷雨可能停運，保留 Beach Train / 的士回海雲台方案。'],['海東龍宮寺','中雨以上縮短 / 取消；改 Busan National Science Museum 或 Lotte Mall Dongbusan，兩個都同區順路。'],['機張市場','雨天照去，市場 / 餐廳相對可行；建議的士上落車。'],['Skyline Luge','雨天 / 大風可能停；改 Lotte Mall Dongbusan / Busan National Science Museum，完全順路。'],['田浦','雨天仍可行；用地鐵站 / 地下街連接，減少露天步行。'],['金海國際機場','雨天 / 塞車就早少少出發。']];let rows=[],tab='Day 1',q='';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m==='"'?'&quot;':'&#39;');function csv(t){let out=[],r=[],c='',qq=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(qq){if(ch==='"'&&n==='"'){c+='"';i++}else if(ch==='"')qq=false;else c+=ch}else{if(ch==='"')qq=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);out.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}}if(c||r.length){r.push(c);out.push(r)}let h=out.shift()||H;return out.map(a=>norm(Object.fromEntries(h.map((x,i)=>[x,a[i]||'']))))}function norm(o){let x={};H.forEach(h=>x[h]=(o[h]||'').trim());return x}function rain(x){return x.RainPlan||((FALLBACK.find(([k])=>(x.TitleZH+x.TitleKO+x.Notes).includes(k))||[])[1])||''}function isRestaurant(x){return x.Day==='餐廳'||x.RestaurantID||x.Cuisine||x.Signature}function link(url,label){if(!url)return'';let u=String(url).split(';')[0].trim();return /^https?:/.test(u)?'<a class="btn" target="_blank" rel="noopener" href="'+esc(u)+'">'+label+'</a>':''}async function init(){try{let txt=await fetch(CSV,{cache:'no-store'}).then(r=>r.text());rows=csv(txt).filter(x=>x.Day&&x.TitleZH)}catch(e){list.innerHTML='<div class="empty">Load failed: '+esc(e.message)+'</div>'}render()}function renderTabs(){tabs.innerHTML=TABS.map(t=>'<button class="pill '+(t===tab?'on':'')+'" onclick="tab=\''+t+'\';render()">'+esc(t)+(DATES[t]?'<small>'+DATES[t]+'</small>':'')+'</button>').join('')}function data(){let s=q.toLowerCase();return rows.filter(x=>{let ok=tab==='餐廳'?isRestaurant(x):x.Day===tab;return ok&&(!s||JSON.stringify(x).toLowerCase().includes(s))})}function render(){renderTabs();let d=data();head.textContent=tab+(DATES[tab]?' · '+DATES[tab]:'');count.textContent=(DATES[tab]?'':'Original tab')+' · '+d.length+' rows';list.innerHTML=d.length?d.map(card).join(''):'<div class="empty">No matching rows</div>'}function card(x){return isRestaurant(x)?restCard(x):planCard(x)}function planCard(x){let rp=rain(x);let time=[x.Start,x.End].filter(Boolean).join('–');return '<article class="card"><div class="body"><div class="row"><span class="time">'+esc(time||x.Date||'')+'</span>'+(x.VBP?'<span class="tag vbp">'+esc(x.VBP)+'</span>':'')+'</div><h3 class="title">'+esc(x.TitleZH)+'</h3><div class="ko">'+esc(x.TitleKO||x.LocationKO)+'</div>'+(x.Notes?'<p class="note">'+esc(x.Notes)+'</p>':'')+(rp?'<div class="rain"><b>☔ Rain Plan</b><div>'+esc(rp)+'</div></div>':'')+(x.TravelTime?'<div class="transport">順路交通：'+esc(x.TravelTime)+'</div>':'')+'<div class="chips">'+[x.Category,x.Area,x.NearestStation].filter(Boolean).map(v=>'<span class="tag">'+esc(v)+'</span>').join('')+'</div></div></article>'}function restCard(x){return '<article class="card restaurant"><div class="body"><div class="row"><span class="time">餐廳</span><span class="tag">'+esc(x.Area||x.NearestStation||'')+'</span></div><h3 class="title">'+esc(x.TitleZH)+'</h3><div class="ko">'+esc(x.TitleKO||x.LocationKO)+'</div><p class="meta">'+esc([x.Cuisine,x.Signature,x.PriceKRW].filter(Boolean).join(' · '))+'</p><div class="restInfo"><b>餐廳資料</b><div>'+esc([x.OpeningHours,x.ClosedDays,x.NearestStation].filter(Boolean).join(' · ')||'營業時間 / booking 以 Naver 當日為準')+'</div></div>'+(rain(x)?'<div class="rain"><b>☔ Rain Plan</b><div>'+esc(rain(x))+'</div></div>':'')+'<div class="actions">'+link(x.ReservationURL,'Booking')+link(x.NaverPlaceUrl,'Naver')+link(x.KakaoPlaceUrl,'Kakao')+'</div></div></article>'}search.oninput=e=>{q=e.target.value;render()};prev.onclick=()=>{let i=Math.max(0,TABS.indexOf(tab)-1);tab=TABS[i];render()};next.onclick=()=>{let i=Math.min(TABS.length-1,TABS.indexOf(tab)+1);tab=TABS[i];render()};copy.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(location.href);init();</script></body></html>
