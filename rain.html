<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busan Rain Plan</title>
<style>html,body{margin:0;height:100%;background:#0b1110;color:#f2f6f3;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif}.boot{display:grid;place-items:center;min-height:100svh;padding:24px;text-align:center}.boot b{font-size:22px}.boot p{color:#9aa9a3}</style>
</head>
<body>
<div class="boot"><div><b>Loading Busan Planner Rain View…</b><p>Using index.html design, then applying Rain Plan overlay.</p></div></div>
<script>
const DATES={
  'Day 1':'Day 1 · 6/19 Fri',
  'Day 2':'Day 2 · 6/20 Sat',
  'Day 3':'Day 3 · 6/21 Sun',
  'Day 4':'Day 4 · 6/22 Mon',
  'Day 5':'Day 5 · 6/23 Tue'
};
const RAIN=[
  [['金海國際機場','김해국제공항','Gimhae'],'雨天無大問題；如果落大雨，直接用的士去酒店，唔好拖行李轉太多站。'],
  [['酒店','放低行李','luggage'],'大雨就留酒店附近食早餐，等雨細先出去，避免拖喼濕身。'],
  [['海雲台早餐','海雲台傳統市場','해운대전통시장'],'市場有部分遮蓋但唔係全室內；大雨可改附近 café / hotel breakfast。'],
  [['南浦','札嘎其','자갈치','Jagalchi'],'雨天可照行：札嘎其市場大樓、南浦地下街、樂天百貨光復店都順路。'],
  [['BIFF','光復路','國際市場'],'大雨就縮短 BIFF / 國際市場，轉南浦地下街 + 樂天光復店，唔使折返。'],
  [['返回海雲台','返海雲台'],'落雨就直接地鐵 / 的士回酒店，西面 optional 取消。'],
  [['甘川文化村','감천문화마을'],'中雨以上唔建議慢行山坡；改 ARTE 早入場，甘川縮短做30–45分鐘影相位。'],
  [['影島大橋','영도대교'],'小雨可睇；大雨就改樂天光復店內休息 / 觀景，唔好企戶外等太耐。'],
  [['ARTE','아르떼뮤지엄'],'雨天主力景點；如果甘川取消，就直接加長 ARTE 時間。'],
  [['廣安里','광안리','drone','드론'],'無人機 show 遇雨 / 強風可能取消；直接改廣安里室內餐廳 / café，或去 Centum City / Spa Land。'],
  [['遊艇','요트','yacht'],'雨天 / 大風取消，唔好硬上；改室內 café 或直接回酒店。'],
  [['海雲台海灘','冬柏','동백섬'],'落雨就改 SEA LIFE Busan Aquarium / café；冬柏島濕滑就取消。'],
  [['海理團路','해리단길'],'雨天照去，揀近地鐵 / 的士落車位嘅室內店。'],
  [['Busan X','X the Sky','부산엑스더스카이'],'如果能見度差，縮短參觀；改去 café / SEA LIFE / 新世界 Centum City。'],
  [['Beach Train','해변열차','尾浦','Mipo'],'小雨可照搭；雷雨 / 強風留意停駛，改 Mipo / 青沙浦 café 等候或取消。'],
  [['青沙浦','다릿돌','Cheongsapo'],'濕滑 / 大風就唔行 skywalk，直接去青沙浦室內 café。'],
  [['Sky Capsule','天空膠囊','스카이캡슐'],'小雨景色仍可；強風 / 雷雨可能停運，保留 Beach Train / 的士回海雲台方案。'],
  [['海東龍宮寺','해동용궁사'],'中雨以上縮短 / 取消；改 Busan National Science Museum 或 Lotte Mall Dongbusan，兩個都同區順路。'],
  [['機張市場','기장시장'],'雨天照去，市場 / 餐廳相對可行；建議的士上落車。'],
  [['Skyline Luge','스카이라인루지'],'雨天 / 大風可能停；改 Lotte Mall Dongbusan / Busan National Science Museum，完全順路。'],
  [['Waveon','웨이브온'],'雨天可去但海景差；如果已經累，直接返海雲台休息。'],
  [['田浦','西面','전포','서면'],'雨天仍可行；用地鐵站 / 地下街連接，減少露天步行。'],
  [['最後散步','早餐 / 最後','last walk'],'雨天取消散步，直接 café / 酒店早餐，早少少出機場。'],
  [['取行李','짐 찾기'],'大雨預多15–20分鐘 call taxi。'],
  [['出發去金海','공항으로 이동','Leave for Gimhae'],'雨天 / 塞車就10:00前出發。']
];
const PATCH=`<style>
  .rainPlanBox{margin-top:10px;border:1px solid rgba(93,173,226,.28);background:linear-gradient(135deg,rgba(29,53,87,.86),rgba(21,59,54,.65));border-radius:16px;padding:11px 12px;color:#edf7ff}.rainPlanBox b{display:block;color:#a7d8ff;font-size:12px;letter-spacing:.05em;margin-bottom:4px}.rainPlanBox div{font-size:14px;line-height:1.45}.dateHint{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}
</style>`;
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m==='"'?'&quot;':'&#39;')}
function applyRainPatch(){
  document.head.insertAdjacentHTML('beforeend',PATCH);
  const tick=()=>{
    document.querySelectorAll('#tabs button,.scroller button,.pill').forEach(btn=>{
      const raw=(btn.dataset.t||btn.textContent||'').trim();
      if(DATES[raw]&&!btn.dataset.rainDated){btn.textContent=DATES[raw];btn.dataset.rainDated='1'}
    });
    const head=document.querySelector('#head');
    if(head){const raw=head.textContent.trim(); if(DATES[raw]&&!head.dataset.rainDated){head.textContent=DATES[raw];head.dataset.rainDated='1'}}
    document.querySelectorAll('.card').forEach(card=>{
      if(card.querySelector('.rainPlanBox'))return;
      const text=card.textContent||'';
      const found=RAIN.find(([keys])=>keys.some(k=>text.includes(k)));
      if(!found)return;
      const box=document.createElement('div');
      box.className='rainPlanBox';
      box.innerHTML='<b>☔ Rain Plan</b><div>'+escapeHtml(found[1])+'</div>';
      const body=card.querySelector('.body')||card;
      const anchor=body.querySelector('.actions')||body.querySelector('.chips')||body.querySelector('.editPanel')||null;
      if(anchor)body.insertBefore(box,anchor); else body.appendChild(box);
    });
  };
  tick();
  new MutationObserver(tick).observe(document.body,{childList:true,subtree:true,characterData:true});
}
fetch('index.html',{cache:'no-store'}).then(r=>r.text()).then(html=>{
  html=html.replace('</body>','<script>('+applyRainPatch.toString()+')();<\\/script></body>');
  document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<div class="boot"><div><b>Load failed</b><p>'+escapeHtml(e.message)+'</p></div></div>'});
</script>
</body>
</html>
