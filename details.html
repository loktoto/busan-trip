<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Busan Planner Details</title>
  <style>
    :root{--bg:#0b1110;--card:#121b18;--ink:#f2f6f3;--muted:#9aa9a3;--line:#273630;--brand:#2dd4bf;--warn:#f59e0b;--bad:#f87171;--ok:#34d399;--soft:#153b36}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif;line-height:1.45}.app{max-width:860px;margin:auto;padding:14px 12px 80px}.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg),rgba(11,17,16,.92));padding:12px 0 10px;border-bottom:1px solid var(--line)}h1{font-size:28px;line-height:1;margin:0 0 4px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:13px}.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:13px 14px;font-size:16px;margin-top:10px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;padding:9px 13px;font-weight:800}.tabs button.on{background:var(--brand);color:#06201b;border-color:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:0 0 12px;box-shadow:0 12px 28px rgba(0,0,0,.2)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:20px;font-weight:900;line-height:1.15;letter-spacing:-.03em}.ko{color:var(--brand);font-weight:850;margin-top:3px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--muted);white-space:nowrap}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.info{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:9px 10px}.label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em}.val{font-size:14px;margin-top:2px;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{display:inline-flex;align-items:center;min-height:38px;border-radius:12px;background:var(--soft);border:1px solid var(--line);color:var(--brand);font-weight:850;padding:8px 10px;text-decoration:none}.empty{padding:40px 10px;color:var(--muted);text-align:center}@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Busan Planner — Info / Booking View</h1>
      <div class="muted">Shows Google Sheet fields: OpeningHours, ClosedDays, ReservationURL, SourceURL, DataStatus, RainPlan, Naver/Kakao links.</div>
      <input id="q" class="search" placeholder="搜尋餐廳 / 景點 / 韓文 / Day / OpeningHours / RainPlan / ReservationURL">
      <nav class="tabs" id="tabs"></nav>
    </header>
    <section id="list"></section>
  </main>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';
const H='Day,Date,Start,End,TitleZH,TitleKO,LocationZH,LocationKO,Notes,VBP,Category,MapQueryKO,ImageUrl,PhotoCredit,Remark,AddressKO,TravelTime,RainPlan,LastSavedAt,RestaurantID,Cuisine,Signature,Area,NearestStation,PriceKRW,Michelin2026,BlueRibbon,IGThreadsHot,BlackSpoon,Priority,DataStatus,SourceURL,ReservationURL,OpeningHours,ClosedDays,Lat,Lng,MapVerified,NaverPlaceUrl,KakaoPlaceUrl'.split(',');
let rows=[],tab='全部',q='';
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':m==='"'?'&quot;':'&#39;'})}
function parseCSV(t){let out=[],r=[],c='',inQuotes=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(inQuotes){if(ch==='"'&&n==='"'){c+='"';i++}else if(ch==='"')inQuotes=false;else c+=ch}else{if(ch==='"')inQuotes=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);out.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}}if(c||r.length){r.push(c);out.push(r)}return out}
function norm(o){let x={};H.forEach(h=>x[h]=(o[h]||'').trim());return x}
function link(url,label){if(!url)return'';let first=String(url).split(';')[0].trim();if(!/^https?:\/\//.test(first))return'';return `<a href="${esc(first)}" target="_blank" rel="noopener">${label}</a>`}
function statusClass(s){s=(s||'').toLowerCase();if(s.includes('verified')||s.includes('官方'))return'ok';if(s.includes('needs')||s.includes('confirm')||s.includes('未'))return'warn';return''}
async function init(){let txt=await fetch(CSV,{cache:'no-store'}).then(r=>r.text());let data=parseCSV(txt);let head=data.shift();rows=data.map(a=>norm(Object.fromEntries(head.map((h,i)=>[h,a[i]||''])))).filter(x=>x.Day&&x.TitleZH);renderTabs();render()}
function renderTabs(){let tabs=['全部','餐廳','Todo','Material','注意','Day 1','Day 2','Day 3','Day 4','Day 5'];$('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTabs();render()})}
function hasInfo(x){return x.OpeningHours||x.ClosedDays||x.ReservationURL||x.SourceURL||x.DataStatus||x.NaverPlaceUrl||x.KakaoPlaceUrl||x.RainPlan}
function render(){q=$('q').value.toLowerCase();let list=rows.filter(x=>(tab==='全部'||x.Day===tab)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).filter(x=>tab!=='全部'||hasInfo(x)||x.Day==='餐廳');$('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching rows</div>'}
function card(x){let period=[x.Date,x.Start&&x.End?`${x.Start}–${x.End}`:x.Start].filter(Boolean).join(' · ');let status=x.DataStatus||x.MapVerified||'';return `<article class="card ${x.Day==='餐廳'?'restaurant':''}"><div class="row"><div><div class="title">${esc(x.TitleZH)}</div><div class="ko">${esc(x.TitleKO)}</div><div class="muted">${esc([x.Day,period,x.Area,x.NearestStation].filter(Boolean).join(' · '))}</div></div><span class="pill ${statusClass(status)}">${esc(status||x.Priority||'info')}</span></div><div class="grid"><div class="info"><div class="label">Opening Hours</div><div class="val">${esc(x.OpeningHours||'未填 / Needs check')}</div></div><div class="info"><div class="label">Closed Days / Risk</div><div class="val">${esc(x.ClosedDays||'未填 / Needs check')}</div></div><div class="info"><div class="label">Reservation</div><div class="val">${esc(x.ReservationURL||x.Notes||'No reservation URL / walk-in or needs check')}</div></div><div class="info"><div class="label">Source</div><div class="val">${esc(x.SourceURL||'未填')}</div></div><div class="info"><div class="label">Price / Cuisine</div><div class="val">${esc([x.PriceKRW,x.Cuisine,x.Signature].filter(Boolean).join(' · '))}</div></div><div class="info"><div class="label">Address / Map</div><div class="val">${esc(x.AddressKO||x.LocationKO||x.MapQueryKO||'')}</div></div><div class="info"><div class="label">Rain Plan</div><div class="val">${esc(x.RainPlan||'未填 / Needs plan')}</div></div></div><div class="actions">${link(x.ReservationURL,'預約 / Booking')}${link(x.SourceURL,'資料來源')}${link(x.NaverPlaceUrl,'Naver')}${link(x.KakaoPlaceUrl,'Kakao')}</div></article>`}
$('q').addEventListener('input',render);init().catch(e=>{$('list').innerHTML='<div class="empty">Load failed: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
