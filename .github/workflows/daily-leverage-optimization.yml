name: Daily leverage optimisation

on:
  pull_request:
    branches: [main]
    paths:
      - research/daily_leverage_20260721/**
      - .github/workflows/daily-leverage-optimization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Run robust daily optimiser
        run: python research/daily_leverage_20260721/optimize_daily_leverage.py
      - name: Show optimisation summary
        if: always()
        run: |
          test -f research_outputs/daily_leverage_20260721/optimised_summary.md && cat research_outputs/daily_leverage_20260721/optimised_summary.md || true
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-leverage-optimisation-20260721
          path: research_outputs/daily_leverage_20260721
          if-no-files-found: error
          retention-days: 14
