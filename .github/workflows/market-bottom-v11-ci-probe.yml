name: Market Bottom v1.1 CI Probe

on:
  pull_request:
    paths:
      - ".github/workflows/market-bottom-v11-ci-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v1.1 head
        uses: actions/checkout@v4
        with:
          ref: agent/market-bottom-recovery-v1-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/market-bottom/requirements.txt

      - name: Compile modules
        run: python -m compileall -q research/market-bottom

      - name: Run full pytest suite
        working-directory: research/market-bottom
        run: pytest -q --tb=short

      - name: Run full-history v1.1 comparison
        run: python research/market-bottom/validate_recovery_v11.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-v11-final-probe
          path: |
            runtime/market-bottom/recovery-v11-validation.json
            runtime/market-bottom/recovery-v11-validation.md
          if-no-files-found: warn

  prepare-merged-branch:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest production base
        uses: actions/checkout@v4
        with:
          ref: agent/market-bottom-strategy
          fetch-depth: 0

      - name: Merge validated v1.1 branch with audited conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/market-bottom-recovery-v1-1
          git checkout -B agent/market-bottom-recovery-v1-1-merged origin/agent/market-bottom-strategy

          set +e
          git merge --no-ff --no-commit origin/agent/market-bottom-recovery-v1-1
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            printf 'Conflicts:\n%s\n' "$conflicts"
            allowed="$(printf '%s\n' \
              '.github/workflows/market-bottom-research.yml' \
              'research/market-bottom/prepare_live_input.py' | sort)"
            if [ "$conflicts" != "$allowed" ]; then
              echo "Unexpected merge conflict set; aborting"
              git merge --abort || true
              exit 1
            fi
            git checkout --theirs -- \
              .github/workflows/market-bottom-research.yml \
              research/market-bottom/prepare_live_input.py
            git add \
              .github/workflows/market-bottom-research.yml \
              research/market-bottom/prepare_live_input.py
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved conflicts remain: $unresolved"
            exit 1
          fi
          git add -A
          git commit -m "merge: rebase validated market-bottom v1.1 onto latest runtime base"
          git push --force-with-lease origin HEAD:agent/market-bottom-recovery-v1-1-merged
