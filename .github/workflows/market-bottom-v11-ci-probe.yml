name: Market Bottom v1.1 CI Probe

on:
  pull_request:
    paths:
      - ".github/workflows/market-bottom-v11-ci-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v1.1 head
        uses: actions/checkout@v4
        with:
          ref: agent/market-bottom-recovery-v1-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r research/market-bottom/requirements.txt

      - name: Compile modules
        run: python -m compileall -q research/market-bottom

      - name: Run full pytest suite
        working-directory: research/market-bottom
        run: pytest -q --tb=short

      - name: Run full-history v1.1 comparison
        run: python research/market-bottom/validate_recovery_v11.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-v11-final-probe
          path: |
            runtime/market-bottom/recovery-v11-validation.json
            runtime/market-bottom/recovery-v11-validation.md
          if-no-files-found: warn
