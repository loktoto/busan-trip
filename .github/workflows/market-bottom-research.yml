name: Market Bottom Research

on:
  pull_request:
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"
  push:
    branches:
      - "agent/market-bottom-strategy"
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/market-bottom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile all research modules
        run: python -m compileall -q .
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Archive pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-pytest-${{ github.run_id }}
          path: research/market-bottom/pytest.log
          if-no-files-found: error
          retention-days: 7
