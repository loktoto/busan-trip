name: Market Bottom Research

on:
  pull_request:
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"
  push:
    branches:
      - "agent/market-bottom-strategy"
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/market-bottom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile research modules
        run: >-
          python -m py_compile
          backtest.py validation.py robust_validation.py selection.py
          ablation.py data_audit.py leverage.py
          tests/test_backtest.py tests/test_selection_and_audit.py tests/test_leverage.py
      - name: Run regression tests
        run: pytest -q
