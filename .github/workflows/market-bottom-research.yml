name: Market Bottom Research

on:
  pull_request:
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"
      - "runtime/market-bottom/latest-request.json"
  push:
    branches:
      - "agent/market-bottom-strategy"
    paths:
      - "research/market-bottom/**"
      - ".github/workflows/market-bottom-research.yml"
      - "runtime/market-bottom/latest-request.json"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/market-bottom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile all research modules
        run: python -m compileall -q .
      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Archive pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-pytest-${{ github.run_id }}
          path: research/market-bottom/pytest.log
          if-no-files-found: error
          retention-days: 7

      - name: Run public SMH-SOXX paired reproducibility diagnostic
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf paired-diagnostic-data paired-diagnostic-output
          mkdir -p paired-diagnostic-data paired-diagnostic-output
          {
            echo "Classification: PUBLIC REPRODUCIBILITY DIAGNOSTIC — NOT IBKR HOLDOUT"
            python fetch_public_prices.py --symbol SMH --out paired-diagnostic-data/SMH.csv
            smh_status=$?
            python fetch_public_prices.py --symbol SOXX --out paired-diagnostic-data/SOXX.csv
            soxx_status=$?
            if [ "$smh_status" -ne 0 ] || [ "$soxx_status" -ne 0 ]; then
              echo "DATA_UNAVAILABLE: public price fetch failed (SMH=$smh_status SOXX=$soxx_status)"
              exit 0
            fi
            python data_audit.py --csv paired-diagnostic-data/SMH.csv --out paired-diagnostic-output/audit-SMH
            audit_smh=$?
            python data_audit.py --csv paired-diagnostic-data/SOXX.csv --out paired-diagnostic-output/audit-SOXX
            audit_soxx=$?
            if [ "$audit_smh" -ne 0 ] || [ "$audit_soxx" -ne 0 ]; then
              echo "DATA_UNAVAILABLE: adjusted-price audit failed (SMH=$audit_smh SOXX=$audit_soxx)"
              exit 0
            fi
            python paired_semiconductor.py \
              --smh-csv paired-diagnostic-data/SMH.csv \
              --soxx-csv paired-diagnostic-data/SOXX.csv \
              --config config.example.json \
              --out paired-diagnostic-output/full-history
            full_status=$?
            python paired_semiconductor.py \
              --smh-csv paired-diagnostic-data/SMH.csv \
              --soxx-csv paired-diagnostic-data/SOXX.csv \
              --config config.example.json \
              --signal-start 2024-01-01 \
              --out paired-diagnostic-output/modern-2024
            modern_status=$?
            echo "paired diagnostic exit status: full=$full_status modern=$modern_status"
          } 2>&1 | tee paired-diagnostic.log
          exit 0
      - name: Archive paired semiconductor diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-semiconductor-${{ github.run_id }}
          path: |
            research/market-bottom/paired-diagnostic.log
            research/market-bottom/paired-diagnostic-data/*.manifest.json
            research/market-bottom/paired-diagnostic-output/**
          if-no-files-found: warn
          retention-days: 7

  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/market-bottom-strategy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r research/market-bottom/requirements.txt
      - name: Check runtime request
        id: runtime
        shell: bash
        run: |
          if [ -s runtime/market-bottom/latest-request.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap missing adjusted daily histories
        if: steps.runtime.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/market-bottom/data
          for symbol in SPY QQQ SOXX SMH; do
            file="runtime/market-bottom/data/${symbol}.csv"
            if [ ! -s "$file" ]; then
              echo "BOOTSTRAP ${symbol}: PUBLIC ADJUSTED HISTORY — LIVE SNAPSHOT REMAINS IBKR"
              python research/market-bottom/fetch_public_prices.py --symbol "$symbol" --out "$file"
            fi
          done
      - name: Assemble, validate and calculate
        if: steps.runtime.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/market-bottom/generated
          python research/market-bottom/prepare_live_input.py \
            --request runtime/market-bottom/latest-request.json \
            --repo-root . \
            --out runtime/market-bottom/generated/latest-input.json
          previous=""
          if [ -f runtime/market-bottom/latest-result.json ]; then
            previous="--previous runtime/market-bottom/latest-result.json"
          fi
          python research/market-bottom/live_monitor.py \
            --input runtime/market-bottom/generated/latest-input.json \
            --config research/market-bottom/config.example.json \
            $previous \
            --result runtime/market-bottom/generated/latest-result.json \
            --report runtime/market-bottom/generated/latest-report.md
          python -m json.tool runtime/market-bottom/generated/latest-result.json >/dev/null
      - name: Archive immutable live output
        if: steps.runtime.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-live-${{ github.run_id }}
          path: |
            runtime/market-bottom/latest-request.json
            runtime/market-bottom/data/*.csv
            runtime/market-bottom/generated/latest-input.json
            runtime/market-bottom/generated/latest-result.json
            runtime/market-bottom/generated/latest-report.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish deterministic result and bootstrap data
        if: steps.runtime.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/market-bottom/generated/latest-result.json runtime/market-bottom/latest-result.json
          cp runtime/market-bottom/generated/latest-report.md runtime/market-bottom/latest-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/market-bottom/data/*.csv runtime/market-bottom/latest-result.json runtime/market-bottom/latest-report.md
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "runtime: publish bottom result and bootstrap data [skip ci]"
          git pull --rebase origin agent/market-bottom-strategy
          git push origin HEAD:agent/market-bottom-strategy
