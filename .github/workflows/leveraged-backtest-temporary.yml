name: Temporary Leveraged ETF Backtest

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - research/leveraged_backtest_20260720.py
      - research/leveraged_backtest_v2_20260720.py

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix direct-script module path
        run: sed -i 's/from research\.leveraged_backtest_20260720 import (/from leveraged_backtest_20260720 import (/' research/leveraged_backtest_v2_20260720.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance tabulate
      - name: Run risk-sized close-to-close backtest
        id: backtest
        shell: bash
        run: |
          mkdir -p research_outputs/leveraged_backtest_v2_20260720
          set +e
          python research/leveraged_backtest_v2_20260720.py > research_outputs/leveraged_backtest_v2_20260720/console.log 2>&1
          code=$?
          echo "$code" > research_outputs/leveraged_backtest_v2_20260720/exit_code.txt
          tail -n 120 research_outputs/leveraged_backtest_v2_20260720/console.log
          exit $code
      - name: Persist V2 outputs and diagnostics to research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/leveraged_backtest_v2_20260720.py research_outputs/leveraged_backtest_v2_20260720
          git commit -m "add risk-sized leveraged backtest diagnostics" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload V2 research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leveraged-backtest-v2-20260720
          path: research_outputs/leveraged_backtest_v2_20260720
          if-no-files-found: warn
          retention-days: 7
