name: Market Bottom Sector Internals v1.9

on:
  pull_request:
    paths:
      - "research/market-bottom/sector_internal_v19.py"
      - "research/market-bottom/validate_sector_internal_v19.py"
      - "research/market-bottom/tests/test_sector_internal_v19.py"
      - ".github/workflows/market-bottom-sector-internal-v19.yml"
  push:
    branches:
      - "agent/market-bottom-strategy"
    paths:
      - "research/market-bottom/sector_internal_v19.py"
      - "research/market-bottom/validate_sector_internal_v19.py"
      - "research/market-bottom/tests/test_sector_internal_v19.py"
      - ".github/workflows/market-bottom-sector-internal-v19.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/market-bottom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Compile and test internal engine
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q .
          PYTHONPATH=. pytest -q tests/test_sector_internal_v19.py --tb=short 2>&1 | tee sector-internal-v19-pytest.log

      - name: Fetch audited primary histories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sector-internal-v19-data sector-internal-v19-panel sector-internal-v19-output
          mkdir -p sector-internal-v19-data sector-internal-v19-panel sector-internal-v19-output
          for symbol in SPY QQQ SOXX; do
            python fetch_public_prices.py --symbol "$symbol" --out "sector-internal-v19-data/${symbol}.csv"
            python data_audit.py --csv "sector-internal-v19-data/${symbol}.csv" --out "sector-internal-v19-output/audit-${symbol}"
          done

      - name: Fetch fixed research panel histories
        shell: bash
        run: |
          set -euo pipefail
          for symbol in \
            XLB XLE XLF XLI XLK XLP XLU XLV XLY \
            AAPL MSFT AMZN NVDA GOOGL META AVGO COST NFLX TSLA AMD QCOM \
            INTC TXN AMAT LRCX KLAC MU ADI MCHP MRVL ON; do
            if [ ! -f "sector-internal-v19-panel/${symbol}.csv" ]; then
              python fetch_public_prices.py --symbol "$symbol" --out "sector-internal-v19-panel/${symbol}.csv"
            fi
          done

      - name: Run cross-sectional internal validation
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python validate_sector_internal_v19.py \
            --data-dir sector-internal-v19-data \
            --panel-dir sector-internal-v19-panel \
            --config config.example.json \
            --ibkr-audit ibkr-five-year-audit-2026-07-22.json \
            --recent-start 2021-07-26 \
            --out sector-internal-v19-output 2>&1 | tee sector-internal-v19.log

      - name: Archive cross-sectional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-sector-internal-v19-${{ github.run_id }}
          path: |
            research/market-bottom/sector-internal-v19-pytest.log
            research/market-bottom/sector-internal-v19.log
            research/market-bottom/sector-internal-v19-data/*.manifest.json
            research/market-bottom/sector-internal-v19-panel/*.manifest.json
            research/market-bottom/sector-internal-v19-output/**
          if-no-files-found: error
          retention-days: 14
