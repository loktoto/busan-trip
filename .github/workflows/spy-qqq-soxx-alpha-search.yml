name: SPY QQQ SOXX expanded alpha search

on:
  pull_request:
    branches: [agent/index-mags-rebuild-v2-20260722]
    paths:
      - research/spy_qqq_soxx_alpha_search_20260722/**
      - .github/workflows/spy-qqq-soxx-alpha-search.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spy-qqq-soxx-alpha-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repetitions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repetition: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pandas numpy scipy yfinance tabulate
      - name: Validate corrected source integrity
        run: |
          python -m py_compile research/spy_qqq_soxx_alpha_search_20260722/run_alpha_search.py
          python -m py_compile research/spy_qqq_soxx_alpha_search_20260722/compare_repeats.py
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root = Path('research/spy_qqq_soxx_alpha_search_20260722')
          parts = sorted(root.glob('source_v3.part??'))
          if len(parts) != 4:
              raise RuntimeError(parts)
          source = gzip.decompress(base64.b64decode(''.join(part.read_text().strip() for part in parts)))
          digest = hashlib.sha256(source).hexdigest()
          expected = 'f381e7642f1f61f05e8e5715878226395b779ebb6f7ab480789217d7c8cb41b3'
          if digest != expected:
              raise RuntimeError(f'{digest} != {expected}')
          compile(source.decode(), 'alpha_search_engine.py', 'exec')
          print({'source_sha256': digest, 'source_bytes': len(source), 'parts': len(parts)})
          PY
      - name: Run independent anchored search
        run: |
          rm -rf research_outputs/spy_qqq_soxx_alpha_search_20260722
          mkdir -p research_outputs/spy_qqq_soxx_alpha_search_20260722
          PYTHONWARNINGS=ignore python research/spy_qqq_soxx_alpha_search_20260722/run_alpha_search.py \
            > research_outputs/spy_qqq_soxx_alpha_search_20260722/optimizer.log 2>&1
          tail -n 300 research_outputs/spy_qqq_soxx_alpha_search_20260722/optimizer.log
      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          root = Path('research_outputs/spy_qqq_soxx_alpha_search_20260722')
          required = [
              'strategy_identity.csv','window_comparison.csv','candidate_grid.csv',
              'block_diagnostics.csv','walk_forward_choices.csv','ibkr_close_parity.csv',
              'run_manifest.json','input_manifest.json','report.md','optimizer.log'
          ]
          missing = [name for name in required if not (root/name).exists()]
          if missing:
              raise RuntimeError(missing)
          identity = pd.read_csv(root/'strategy_identity.csv')
          if identity.symbol.tolist() != ['QQQ','SOXX','SPY']:
              raise RuntimeError(identity.symbol.tolist())
          parity = pd.read_csv(root/'ibkr_close_parity.csv')
          if (parity.absolute_pct_diff > 0.003).any():
              raise RuntimeError(parity.to_dict('records'))
          choices = pd.read_csv(root/'walk_forward_choices.csv')
          if choices.empty or choices.groupby(['symbol','family']).year.nunique().min() < 10:
              raise RuntimeError('insufficient annual walk-forward choices')
          grid = pd.read_csv(root/'candidate_grid.csv')
          non_baseline = grid[grid.candidate != 'buy_hold']
          if non_baseline.effective_trials.min() < 8:
              raise RuntimeError('effective-trial penalty below economic-family floor')
          if non_baseline.dsr_probability.isna().any():
              raise RuntimeError('missing corrected DSR probability')
          manifest = json.loads((root/'run_manifest.json').read_text())
          expected = 'f381e7642f1f61f05e8e5715878226395b779ebb6f7ab480789217d7c8cb41b3'
          if manifest.get('source_sha256') != expected:
              raise RuntimeError(manifest)
          print(identity.to_string(index=False))
          print({
              'identity_sha256': manifest['identity_sha256'],
              'raw_candidate_count_total': manifest['raw_candidate_count_total'],
              'final_candidate_count': manifest['final_candidate_count'],
              'effective_trials': sorted(non_baseline.effective_trials.unique().tolist()),
          })
          PY
      - name: Upload repetition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-qqq-soxx-alpha-${{ matrix.repetition }}
          path: research_outputs/spy_qqq_soxx_alpha_search_20260722
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: repetitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison dependencies
        run: python -m pip install --quiet pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: spy-qqq-soxx-alpha-*
          path: repetitions
          merge-multiple: false
      - name: Compare source, annual choices and corrected statistics
        run: python research/spy_qqq_soxx_alpha_search_20260722/compare_repeats.py
      - name: Upload canonical result
        uses: actions/upload-artifact@v4
        with:
          name: spy-qqq-soxx-alpha-canonical
          path: canonical
          if-no-files-found: error
          retention-days: 30
