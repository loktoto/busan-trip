name: Semiconductor Leverage V3

on:
  push:
    branches:
      - research/semiconductor-leverage-v3-20260723
    paths:
      - research/semiconductor_leverage/v3_challenger_search.py
      - .github/workflows/semiconductor-leverage-v3.yml
  pull_request:
    branches:
      - main
    paths:
      - research/semiconductor_leverage/v3_challenger_search.py
      - .github/workflows/semiconductor-leverage-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/semiconductor-leverage-v3-20260723
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Run V3 challenger search
        shell: bash
        run: |
          mkdir -p research/semiconductor_leverage/results_v3
          set -o pipefail
          python research/semiconductor_leverage/v3_challenger_search.py 2>&1 | tee research/semiconductor_leverage/results_v3/run.log
      - name: Commit reproducible results
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/semiconductor_leverage/results_v3
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update semiconductor V3 results"
            git push origin HEAD:research/semiconductor-leverage-v3-20260723
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semiconductor-leverage-v3
          path: research/semiconductor_leverage/results_v3
