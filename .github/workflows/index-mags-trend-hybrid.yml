name: Index MAGS trend and pullback hybrid

on:
  pull_request:
    branches:
      - agent/index-mags-entry-exit-20260722
    paths:
      - research/index_mags_trend_hybrid_20260722/**
      - .github/workflows/index-mags-trend-hybrid.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-mags-trend-hybrid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repetitions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repetition: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pandas numpy yfinance
      - name: Compile and validate research source
        run: |
          python -m py_compile research/index_mags_trend_hybrid_20260722/run_trend_hybrid.py
          python -m json.tool research/index_mags_trend_hybrid_20260722/ibkr_audit_20260722.json >/dev/null
      - name: Run independent trend-hybrid calculation
        shell: bash
        run: |
          rm -rf research_outputs/index_mags_trend_hybrid_20260722
          mkdir -p research_outputs/index_mags_trend_hybrid_20260722
          PYTHONWARNINGS=ignore python research/index_mags_trend_hybrid_20260722/run_trend_hybrid.py \
            > research_outputs/index_mags_trend_hybrid_20260722/optimizer.log 2>&1
          tail -n 240 research_outputs/index_mags_trend_hybrid_20260722/optimizer.log
      - name: Validate six assets and four strategies
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('research_outputs/index_mags_trend_hybrid_20260722')
          summary = pd.read_csv(root / 'strategy_summary.csv')
          windows = pd.read_csv(root / 'window_comparison.csv')
          identity = pd.read_csv(root / 'strategy_identity.csv')
          expected_symbols = ['MAGS10','MAGS7','QQQ','SMH','SOXX','SPY']
          expected_strategies = ['Buy & Hold','Hybrid','Pullback-only','Trend-only']
          if sorted(identity.symbol.astype(str).tolist()) != expected_symbols:
              raise RuntimeError(f'Unexpected identity assets: {identity.symbol.tolist()}')
          counts = summary.groupby('symbol').strategy.nunique()
          if len(counts) != 6 or not (counts == 4).all():
              raise RuntimeError(f'Expected four strategies per asset: {counts.to_dict()}')
          for symbol, group in summary.groupby('symbol'):
              if sorted(group.strategy.astype(str).tolist()) != expected_strategies:
                  raise RuntimeError(f'{symbol}: unexpected strategies {group.strategy.tolist()}')
          if not {'1Y','3Y','5Y','10Y','MAX'}.issubset(set(windows[windows.symbol != 'MAGS10'].window)):
              raise RuntimeError('Missing required windows for long-history assets')
          if '10Y' in set(windows[windows.symbol == 'MAGS10'].window):
              raise RuntimeError('MAGS10 must not claim ten-year history')
          print(identity.to_string(index=False))
          PY
      - name: Upload repetition
        uses: actions/upload-artifact@v4
        with:
          name: index-mags-trend-hybrid-${{ matrix.repetition }}
          path: research_outputs/index_mags_trend_hybrid_20260722
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: repetitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison dependency
        run: python -m pip install --quiet pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: index-mags-trend-hybrid-*
          path: repetitions
          merge-multiple: false
      - name: Compare identities and metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import numpy as np
          import pandas as pd

          roots = sorted(path for path in Path('repetitions').iterdir() if path.is_dir())
          if len(roots) != 2:
              raise RuntimeError(f'Expected two repetitions, found {roots}')
          left_root, right_root = roots

          left_identity = pd.read_csv(left_root / 'strategy_identity.csv').sort_values('symbol').reset_index(drop=True)
          right_identity = pd.read_csv(right_root / 'strategy_identity.csv').sort_values('symbol').reset_index(drop=True)
          identity_columns = [
              'symbol','trend_rule','off_exposure','pullback_available','current_trend_on',
              'current_pullback_addon','current_hybrid_exposure'
          ]
          left_canonical = left_identity[identity_columns].to_csv(index=False, float_format='%.8f')
          right_canonical = right_identity[identity_columns].to_csv(index=False, float_format='%.8f')
          if left_canonical != right_canonical:
              raise RuntimeError(f'Strategy identity mismatch\nLEFT\n{left_canonical}\nRIGHT\n{right_canonical}')

          metric_tolerances = {
              'cagr': 0.0005,
              'sharpe': 0.002,
              'maxdd': 0.0005,
              'vol': 0.0005,
              'calmar': 0.002,
              'terminal': None,
          }
          comparison = {'identity_equal': True, 'summary_max_differences': {}, 'window_max_differences': {}}
          for filename, keys, output_key in [
              ('strategy_summary.csv', ['symbol','strategy'], 'summary_max_differences'),
              ('window_comparison.csv', ['symbol','strategy','window','start','end'], 'window_max_differences'),
          ]:
              left = pd.read_csv(left_root / filename).sort_values(keys).reset_index(drop=True)
              right = pd.read_csv(right_root / filename).sort_values(keys).reset_index(drop=True)
              if left[keys].astype(str).to_csv(index=False) != right[keys].astype(str).to_csv(index=False):
                  raise RuntimeError(f'{filename}: row identity mismatch')
              for column, tolerance in metric_tolerances.items():
                  if column not in left.columns: continue
                  difference = (pd.to_numeric(left[column], errors='coerce') - pd.to_numeric(right[column], errors='coerce')).abs()
                  maximum = float(difference.fillna(0).max())
                  comparison[output_key][column] = maximum
                  if column == 'terminal':
                      scale = np.maximum(pd.to_numeric(left[column], errors='coerce').abs(), 1.0)
                      relative = float((difference / scale).fillna(0).max())
                      comparison[output_key]['terminal_relative'] = relative
                      if relative > 0.0015:
                          raise RuntimeError(f'{filename}: terminal relative difference {relative:.6%} exceeds 0.15%')
                  elif maximum > tolerance:
                      raise RuntimeError(f'{filename}: {column} difference {maximum} exceeds {tolerance}')

          identity_sha = hashlib.sha256(left_canonical.encode()).hexdigest()
          comparison.update({
              'status': 'PASS',
              'identity_sha256': identity_sha,
              'source_artifacts': [root.name for root in roots],
              'metric_tolerances': metric_tolerances,
          })
          canonical = Path('canonical')
          shutil.copytree(left_root, canonical)
          (canonical / 'repeatability.json').write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          print((canonical / 'report.md').read_text())
          PY
      - name: Upload canonical trend-hybrid report
        uses: actions/upload-artifact@v4
        with:
          name: index-mags-trend-hybrid-canonical
          path: canonical
          if-no-files-found: error
          retention-days: 14
