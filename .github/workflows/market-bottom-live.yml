name: Market Bottom Live Calculation

on:
  push:
    branches:
      - "agent/market-bottom-strategy"
    paths:
      - "runtime/market-bottom/latest-request.json"

permissions:
  contents: write

concurrency:
  group: market-bottom-live
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/market-bottom-strategy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/market-bottom/requirements.txt

      - name: Install deterministic engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/market-bottom/requirements.txt

      - name: Bootstrap missing adjusted daily histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/market-bottom/data
          for symbol in SPY QQQ SOXX SMH; do
            file="runtime/market-bottom/data/${symbol}.csv"
            if [ ! -s "$file" ]; then
              echo "BOOTSTRAP ${symbol}: PUBLIC ADJUSTED HISTORY — LIVE SNAPSHOT REMAINS IBKR"
              python research/market-bottom/fetch_public_prices.py --symbol "$symbol" --out "$file"
            fi
          done

      - name: Assemble, validate and calculate
        run: |
          mkdir -p runtime/market-bottom/generated
          python research/market-bottom/prepare_live_input.py \
            --request runtime/market-bottom/latest-request.json \
            --repo-root . \
            --out runtime/market-bottom/generated/latest-input.json
          previous=""
          if [ -f runtime/market-bottom/latest-result.json ]; then
            previous="--previous runtime/market-bottom/latest-result.json"
          fi
          python research/market-bottom/live_monitor.py \
            --input runtime/market-bottom/generated/latest-input.json \
            --config research/market-bottom/config.example.json \
            $previous \
            --result runtime/market-bottom/generated/latest-result.json \
            --report runtime/market-bottom/generated/latest-report.md
          python -m json.tool runtime/market-bottom/generated/latest-input.json >/dev/null
          python -m json.tool runtime/market-bottom/generated/latest-result.json >/dev/null

      - name: Archive immutable run output
        uses: actions/upload-artifact@v4
        with:
          name: market-bottom-live-${{ github.run_id }}
          path: |
            runtime/market-bottom/latest-request.json
            runtime/market-bottom/data/*.csv
            runtime/market-bottom/generated/latest-input.json
            runtime/market-bottom/generated/latest-result.json
            runtime/market-bottom/generated/latest-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest deterministic result and bootstrap data
        run: |
          cp runtime/market-bottom/generated/latest-result.json runtime/market-bottom/latest-result.json
          cp runtime/market-bottom/generated/latest-report.md runtime/market-bottom/latest-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/market-bottom/data/*.csv runtime/market-bottom/latest-result.json runtime/market-bottom/latest-report.md
          if git diff --cached --quiet; then
            echo "No result change"
            exit 0
          fi
          git commit -m "runtime: publish bottom result and bootstrap data [skip ci]"
          git pull --rebase origin agent/market-bottom-strategy
          git push origin HEAD:agent/market-bottom-strategy
