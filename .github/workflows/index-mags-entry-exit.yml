name: Focused index and MAGS entry exit research

on:
  pull_request:
    branches:
      - main
      - agent/universal-v5-challenger-20260722
    paths:
      - research/index_mags_entry_exit_20260722/**
      - .github/workflows/index-mags-entry-exit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-mags-entry-exit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repeat-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repetition: [a, b]
        symbol: [SPY, QQQ, SOXX, SMH, MAGS7, MAGS10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pip pandas numpy yfinance
      - name: Compile focused research source
        run: |
          python -m py_compile research/index_mags_entry_exit_20260722/run_index_mags_v5.py
          python -m py_compile research/index_mags_entry_exit_20260722/focused_basket_patch.py
          python -m py_compile research/index_mags_entry_exit_20260722/compare_focused_repeats.py
          python -m json.tool research/index_mags_entry_exit_20260722/universe_index_mags.json >/dev/null
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          root = Path('research/universal_entry_exit_20260722_v5')
          parts = sorted(root.glob('challenger_patch_v5.py.gz.b64.part??'))
          if not parts:
              raise RuntimeError('Missing V5 source parts')
          source = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts).strip())).decode()
          compile(source, 'v5_challenger.py', 'exec')
          PY
      - name: Run one focused asset
        shell: bash
        env:
          FOCUSED_SYMBOL: ${{ matrix.symbol }}
        run: |
          rm -rf research_outputs/index_mags_entry_exit_20260722
          mkdir -p research_outputs/index_mags_entry_exit_20260722
          PYTHONWARNINGS=ignore python research/index_mags_entry_exit_20260722/run_index_mags_v5.py \
            > research_outputs/index_mags_entry_exit_20260722/optimizer.log 2>&1
          tail -n 240 research_outputs/index_mags_entry_exit_20260722/optimizer.log
      - name: Validate one-asset output
        env:
          EXPECTED_SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd
          path = Path('research_outputs/index_mags_entry_exit_20260722/summary.csv')
          if not path.exists():
              raise RuntimeError('Missing focused summary.csv')
          frame = pd.read_csv(path)
          expected = os.environ['EXPECTED_SYMBOL']
          if len(frame) != 1 or str(frame.iloc[0]['symbol']) != expected:
              raise RuntimeError(f'Expected only {expected}; got {frame.symbol.tolist()}')
          status = str(frame.iloc[0].get('v5_status', ''))
          if status.startswith('ERROR'):
              raise RuntimeError(f'{expected} V5 challenger error: {status}')
          columns = [c for c in [
              'symbol','decision','production_action','diagnostic_action','v5_status',
              'v5_decision','v5_production_action','v5_diagnostic_action','v5_mode',
              'v5_current_exposure'
          ] if c in frame.columns]
          print(frame[columns].to_string(index=False))
          PY
      - name: Upload repetition asset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-mags-entry-exit-${{ matrix.repetition }}-${{ matrix.symbol }}
          path: research_outputs/index_mags_entry_exit_20260722
          if-no-files-found: warn
          retention-days: 14

  aggregate-repetition:
    needs: repeat-assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repetition: [a, b]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aggregation dependency
        run: python -m pip install --quiet pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: index-mags-entry-exit-${{ matrix.repetition }}-*
          path: repetition_assets
          merge-multiple: false
      - name: Aggregate six focused assets
        env:
          REPETITION: ${{ matrix.repetition }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          files = sorted(Path('repetition_assets').glob('*/summary.csv'))
          if len(files) != 6:
              raise RuntimeError(f'Expected six asset summaries, found {len(files)}')
          frame = pd.concat([pd.read_csv(path) for path in files], ignore_index=True)
          frame = frame.sort_values('symbol').reset_index(drop=True)
          expected = ['MAGS10','MAGS7','QQQ','SMH','SOXX','SPY']
          if frame.symbol.astype(str).tolist() != expected:
              raise RuntimeError(f'Expected {expected}; got {frame.symbol.tolist()}')
          if frame.symbol.duplicated().any():
              raise RuntimeError('Duplicate focused assets')
          status = frame.get('v5_status', pd.Series('', index=frame.index)).fillna('').astype(str)
          if status.str.startswith('ERROR').any():
              raise RuntimeError(f'Focused V5 errors: {frame.loc[status.str.startswith("ERROR"), ["symbol","v5_status"]].to_dict("records")}')
          repetition = os.environ['REPETITION']
          out = Path('aggregated')
          out.mkdir(exist_ok=True)
          frame.to_csv(out / f'focused_summary_{repetition}.csv', index=False, float_format='%.8f')
          print(frame[[
              'symbol','decision','production_action','diagnostic_action','v5_status',
              'v5_decision','v5_production_action','v5_diagnostic_action','v5_mode',
              'v5_current_exposure'
          ]].to_string(index=False))
          PY
      - name: Upload repetition aggregate
        uses: actions/upload-artifact@v4
        with:
          name: index-mags-entry-exit-aggregate-${{ matrix.repetition }}
          path: aggregated
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: aggregate-repetition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison dependency
        run: python -m pip install --quiet pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: index-mags-entry-exit-aggregate-*
          path: aggregates
          merge-multiple: false
      - name: Compare production identity and audit rejected diagnostics
        run: python research/index_mags_entry_exit_20260722/compare_focused_repeats.py
      - name: Upload canonical focused result
        uses: actions/upload-artifact@v4
        with:
          name: index-mags-entry-exit-canonical
          path: |
            focused_repeatability.json
            focused_summary.csv
            aggregates
          if-no-files-found: error
          retention-days: 14
