name: Semiconductor Leverage Audit

on:
  push:
    branches:
      - research/semiconductor-leverage-audit-20260722-v2
    paths:
      - research/semiconductor_leverage/semiconductor_leverage_audit.py
      - .github/workflows/semiconductor-leverage-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - research/semiconductor_leverage/semiconductor_leverage_audit.py
      - .github/workflows/semiconductor-leverage-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/semiconductor-leverage-audit-20260722-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance

      - name: Run daily strategy audit
        run: python research/semiconductor_leverage/semiconductor_leverage_audit.py

      - name: Commit reproducible results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/semiconductor_leverage/results
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update semiconductor leverage audit results"
            git push origin HEAD:research/semiconductor-leverage-audit-20260722-v2
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: semiconductor-leverage-audit
          path: research/semiconductor_leverage/results
