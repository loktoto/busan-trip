<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Busan Step 2 Preview</title>
<style>
:root{--bg:#0b1110;--card:#121b18;--ink:#f2f6f3;--muted:#9aa9a3;--line:#273630;--brand:#2dd4bf;--soft:#153b36;--warn:#f59e0b;--ok:#34d399;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans HK,Noto Sans TC,Noto Sans KR,Arial,sans-serif;line-height:1.45}.app{max-width:880px;margin:auto;padding:12px 12px 90px}.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 88%,rgba(11,17,16,.86));margin:-12px -12px 12px;padding:12px;border-bottom:1px solid var(--line)}h1{font-size:28px;line-height:1;margin:0;letter-spacing:-.05em}.muted{color:var(--muted);font-size:13px}.search{width:100%;min-height:50px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:12px 14px;font-size:16px;margin-top:10px}.tabs{display:flex;gap:8px;overflow:auto;-webkit-overflow-scrolling:touch;padding:9px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;min-height:40px;padding:8px 12px;font-weight:850}.tabs button.on{background:var(--brand);color:#06201b;border-color:var(--brand)}.map{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:0 0 12px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.mapHead{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.mapBody{overflow:auto;background:white;max-height:46vh;-webkit-overflow-scrolling:touch}.stage{position:relative;width:1200px}.stage img{display:block;width:100%}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid white;background:var(--brand);color:white;border-radius:999px;min-width:38px;height:38px;font-size:11px;font-weight:900;z-index:2}.pin.sel{background:#d97706}.pl{position:absolute;transform:translate(-50%,22px);background:rgba(255,255,255,.94);color:#111;border:1px solid #ddd;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:850;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px}.stat{padding:10px}.stat b{display:block;font-size:18px}.card{margin:0 0 12px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.row{display:flex;justify-content:space-between;gap:10px}.time,.tag{display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:850;padding:5px 8px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}.time{background:var(--soft);color:var(--brand)}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.title{font-size:21px;line-height:1.12;font-weight:950;letter-spacing:-.04em;margin:9px 0 3px}.ko{color:var(--brand);font-weight:850}.note{color:var(--muted);font-size:14px;margin:9px 0 0}.grid{display:grid;gap:8px;margin-top:12px}.info{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:9px 10px;min-width:0}.label{font-size:11px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.04em}.val{font-size:14px;margin-top:2px;word-break:break-word}.empty{color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.actions a{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:14px;background:var(--soft);border:1px solid var(--line);color:var(--brand);font-weight:900;text-decoration:none}.foot{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:760px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.foot a,.foot button{border:0;border-radius:16px;min-height:46px;background:var(--soft);color:var(--brand);font-weight:950;text-decoration:none;display:flex;align-items:center;justify-content:center}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.actions{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><h1>Step 2 Preview</h1><div class="muted" id="status">Loading Google Sheet…</div><input class="search" id="q" placeholder="搜尋景點 / 餐廳 / 韓文 / OpeningHours / Reservation"><nav class="tabs" id="tabs"></nav><nav class="tabs" id="filters"></nav></header>
<section class="map" id="map"><div class="mapHead"><div><b>餐廳地鐵分佈圖</b><br><span class="muted">Preview：保留 MTR map + pins</span></div><button onclick="station='';render()" type="button">全部</button></div><div class="mapBody"><div class="stage" id="stage"><img src="https://pic.pimg.tw/may0103/1442916706-2949340533_n.jpg"></div></div></section>
<section class="stats" id="stats"></section><section id="list"></section>
</main><nav class="foot"><a href="index.html">Back main</a><button onclick="scrollTo({top:0,behavior:'smooth'})" type="button">Top</button></nav>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vR4TVyj03C2qKHxXtkHkpWhzjKC1h9rWNFYc9ZNH_keNQGOF-eOwVL7ArbIi4k-ypa0oMGVfjUNqf0C/pub?output=csv';
const H='Day,Date,Start,End,TitleZH,TitleKO,LocationZH,LocationKO,Notes,VBP,Category,MapQueryKO,ImageUrl,PhotoCredit,Remark,AddressKO,TravelTime,RainPlan,LastSavedAt,RestaurantID,Cuisine,Signature,Area,NearestStation,PriceKRW,Michelin2026,BlueRibbon,IGThreadsHot,BlackSpoon,Priority,DataStatus,SourceURL,ReservationURL,OpeningHours,ClosedDays,Lat,Lng,MapVerified,NaverPlaceUrl,KakaoPlaceUrl'.split(',');
const SC={해운대:[83.5,62.4,'海雲台'],중동:[83.5,66.4,'中洞'],동백:[83.5,58.6,'冬柏'],센텀시티:[81,50.2,'Centum City'],민락:[77.4,50.2,'民樂'],수영:[72.5,50.2,'水營'],광안:[72.5,55.8,'廣安'],금련산:[72.5,59.5,'金蓮山'],남천:[72.5,63.4,'南川'],서면:[55.7,66.7,'西面'],전포:[59.9,70.5,'田浦'],부전:[55.7,58.8,'釜田'],남포:[40.2,86.4,'南浦'],자갈치:[36.6,86.4,'札嘎其'],부산역:[50.1,86.4,'釜山站'],망미:[66.8,50.4,'望美'],동래:[55.7,41,'東萊'],덕천:[17.6,66.7,'德川']};
let rows=[],tab='Day 1',filter='全部',query='',station='';const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function parse(t){let out=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch==='"'&&n==='"'){c+='"';i++;}else if(ch==='"')q=false;else c+=ch;}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c='';}else if(ch==='\n'){r.push(c);out.push(r);r=[];c='';}else if(ch!=='\r')c+=ch;}}if(c||r.length){r.push(c);out.push(r);}return out;}
function norm(o){let x={};H.forEach(h=>x[h]=String(o[h]||'').trim());return x;}function type(x){let d=x.Day,c=(x.Category||'').toLowerCase();if(d==='餐廳')return'餐廳';if(d==='Todo'||c==='todo')return'Todo';if(d==='Material'||c==='material')return'Material';if(d==='注意'||c==='notice')return'注意';return d;}function firstUrl(s){return String(s||'').split(';').map(v=>v.trim()).find(v=>/^https?:\/\//.test(v))||'';}function link(s,l){let u=firstUrl(s);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:'';}function val(s,f='未填 / Needs check'){return s?esc(s):`<span class="empty">${esc(f)}</span>`;}function cls(s){s=String(s||'').toLowerCase();if(s.includes('verified')||s.includes('官方')||s.includes('核實'))return'ok';if(s.includes('needs')||s.includes('check')||s.includes('未')||s.includes('confirm'))return'warn';if(s.includes('not_verified'))return'bad';return'';}
async function init(){try{let text=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.text());let data=parse(text),head=data.shift()||H;rows=data.map(a=>norm(Object.fromEntries(head.map((h,i)=>[h,a[i]||''])))).filter(x=>x.Day&&x.TitleZH);$('status').textContent='Google Sheet connected · '+new Date().toLocaleString('zh-HK',{hour12:false});}catch(e){$('status').textContent='Load failed: '+e.message;}renderTabs();render();}
function renderTabs(){let ds=['Day 1','Day 2','Day 3','Day 4','Day 5','全部','餐廳','Todo','Material','注意'];$('tabs').innerHTML=ds.map(d=>`<button class="${d===tab?'on':''}" data-d="${esc(d)}">${esc(d)}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.d;renderTabs();render();});let fs=['全部','要預約','有OpeningHours','Needs check','已核實','MTR map'];$('filters').innerHTML=fs.map(f=>`<button class="${f===filter?'on':''}" data-f="${esc(f)}">${esc(f)}</button>`).join('');document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderTabs();render();});}
function ok(x){let blob=JSON.stringify(x).toLowerCase();if(tab!=='全部'&&type(x)!==tab&&x.Day!==tab)return false;if(query&&!blob.includes(query))return false;if(station&&x.NearestStation!==station)return false;if(filter==='要預約')return !!x.ReservationURL||/booking|reservation|예약|catchtable|tabling/i.test(blob);if(filter==='有OpeningHours')return !!x.OpeningHours;if(filter==='Needs check')return /needs|check|未|confirm|not_verified/i.test([x.DataStatus,x.OpeningHours,x.ClosedDays,x.ReservationURL,x.MapVerified].join(' '));if(filter==='已核實')return /verified|官方|核實/i.test([x.DataStatus,x.MapVerified].join(' '));if(filter==='MTR map')return type(x)==='餐廳';return true;}
function renderMap(){let counts={};rows.filter(x=>type(x)==='餐廳'&&SC[x.NearestStation]).forEach(x=>counts[x.NearestStation]=(counts[x.NearestStation]||0)+1);$('stage').querySelectorAll('.pin,.pl').forEach(e=>e.remove());Object.keys(counts).forEach(s=>{let p=SC[s],b=document.createElement('button'),l=document.createElement('div');b.className='pin'+(station===s?' sel':'');b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.textContent=counts[s];b.onclick=()=>{station=station===s?'':s;render();};l.className='pl';l.style.left=p[0]+'%';l.style.top=p[1]+'%';l.textContent=p[2];$('stage').appendChild(b);$('stage').appendChild(l);});}
function render(){query=$('q').value.trim().toLowerCase();renderMap();let data=rows.filter(ok);$('stats').innerHTML=`<div class="stat"><b>${rows.length}</b><span class="muted">Total</span></div><div class="stat"><b>${data.length}</b><span class="muted">Showing</span></div><div class="stat"><b>${station||'-'}</b><span class="muted">Station</span></div>`;$('list').innerHTML=data.length?data.map(card).join(''):'<div class="muted">No matching rows</div>';}
function card(x){let period=[x.Date,[x.Start,x.End].filter(Boolean).join('–')].filter(Boolean).join(' · '),status=x.DataStatus||x.MapVerified||type(x);let acts=[link(x.ReservationURL,'預約'),link(x.SourceURL,'來源'),link(x.NaverPlaceUrl,'Naver'),link(x.KakaoPlaceUrl,'Kakao')].filter(Boolean).join('');return `<article class="card"><div class="row"><div><span class="time">${esc([type(x),period].filter(Boolean).join(' · '))}</span><div class="title">${esc(x.TitleZH)}</div><div class="ko">${esc(x.TitleKO)}</div><div class="muted">${esc([x.Area,x.NearestStation,x.LocationZH,x.LocationKO].filter(Boolean).join(' · '))}</div></div><span class="tag ${cls(status)}">${esc(status||'info')}</span></div>${x.Notes?`<p class="note">${esc(x.Notes)}</p>`:''}<div class="grid"><div class="info"><div class="label">OpeningHours</div><div class="val">${val(x.OpeningHours)}</div></div><div class="info"><div class="label">ClosedDays / Risk</div><div class="val">${val(x.ClosedDays)}</div></div><div class="info"><div class="label">ReservationURL</div><div class="val">${val(x.ReservationURL,'No reservation URL / walk-in or needs check')}</div></div><div class="info"><div class="label">SourceURL</div><div class="val">${val(x.SourceURL,'No source URL')}</div></div><div class="info wide"><div class="label">Remark</div><div class="val">${val(x.Remark,'No remark')}</div></div></div>${acts?`<div class="actions">${acts}</div>`:''}</article>`;}
$('q').addEventListener('input',render);init();
</script>
</body>
</html>
